<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 1536"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0878ad"/><stop offset="1" stop-color="#173f78"/></linearGradient></defs><rect width="1171" height="1536" fill="url(#b)"/><path d="M0 300 C250 150 420 350 600 270 C800 180 930 300 1171 190 L1171 1170 C950 1300 820 1160 620 1250 C400 1350 250 1160 0 1290Z" fill="#fff"/><text x="80" y="115" font-family="Arial,sans-serif" font-size="22" fill="#fff">МИНИСТЕРСТВО ПРОСВЕЩЕНИЯ РОССИЙСКОЙ ФЕДЕРАЦИИ</text><text x="600" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#fff">ЦЕНТР ОТКРЫТОГО ОБРАЗОВАНИЯ</text><text x="585" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="72" font-weight="700" fill="#d73737">СЕРТИФИКАТ</text><text x="585" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#555">BD-112</text><text x="585" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#333">подтверждает, что</text><text x="585" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#222">Mahatab Azmaine Refat</text><text x="585" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#333">с 09.09.2024 по 22.11.2024</text><text x="585" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#333">прошел(ла) обучение по программе:</text><text x="585" y="910" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#222">«Русский язык в сфере туризма»</text><text x="585" y="990" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#444">Центр открытого образования на русском языке Санкт-Петербургского</text><text x="585" y="1022" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#444">государственного университета онлайн при поддержке Министерства просвещения</text><text x="585" y="1054" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#444">Российской Федерации и Фонда поддержки гуманитарных наук «Моя история»</text><line x1="90" y1="1190" x2="430" y2="1190" stroke="#555" stroke-width="2"/><text x="90" y="1230" font-family="Arial,sans-serif" font-size="18" fill="#444">И. о. директора</text><text x="90" y="1260" font-family="Arial,sans-serif" font-size="18" fill="#444">Центра языкового тестирования</text><text x="90" y="1290" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#333">А. А. Лесин</text><path d="M700 1280 C780 1210 850 1320 950 1250" fill="none" stroke="#666" stroke-width="3"/><text x="900" y="1390" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#333">22.11.2024</text></svg>