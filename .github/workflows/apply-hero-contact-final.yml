name: Apply final hero and contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hero-contact-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Hero, Contact, CV Privacy and Buttons
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hero = '''      <div class="eyebrow">Health Science × Botany × Digital Growth</div>\n      <h1>Mahatab Azmaine Refat</h1>\n      <div class="tagline">Health Science &amp; Botany student building measurable growth — in research, in learning, and in the audiences I teach online.</div>\n      <div class="hero-cta">\n        <button type="button" class="btn btn-primary" id="viewCvBtn">View CV</button>\n        <a href="#contact" class="btn btn-ghost">Get in Touch</a>\n      </div>'''
          new_hero = '''      <div class="eyebrow">Health Science • Botany • Public Health • Research</div>\n      <h1>Mahatab Azmaine <span class="hero-name-accent">Refat</span></h1>\n      <div class="tagline">Interdisciplinary academic and research portfolio exploring the intersection of human health, plant science, public health, environmental health, and evidence-based practice.</div>\n      <div class="hero-focus" aria-label="Academic focus areas">\n        <span>Health Science</span><span>Botany</span><span>Public Health</span><span>Research</span>\n      </div>\n      <div class="hero-cta">\n        <button type="button" class="btn btn-primary" id="viewCvBtn">View CV</button>\n        <a href="#contact" class="btn btn-ghost">Get in Touch</a>\n      </div>'''
          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)
          elif 'Interdisciplinary academic and research portfolio exploring' not in s:
              raise SystemExit('Hero block not found; refusing to modify.')

          start = s.find('  <!-- CONTACT -->')
          end = s.find('<!-- ---------- EMBEDDED CV PREVIEW ---------- -->')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Contact section markers not found; refusing to modify.')
          contact = '''  <!-- CONTACT -->\n  <footer id="contact">\n    <div class="contact-shell">\n      <div class="contact-kicker">CONTACT</div>\n      <h2>Let’s Connect</h2>\n      <p class="contact-intro">Open to academic collaboration, research opportunities, internships, and professional conversations across health science, public health, and related fields.</p>\n      <div class="contact-row">\n        <a class="contact-pill contact-primary" href="mailto:seoexpertrefat@gmail.com"><span class="contact-icon">✉</span><span>Email</span></a>\n        <a class="contact-pill" href="https://www.linkedin.com/in/mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">in</span><span>LinkedIn</span></a>\n        <a class="contact-pill" href="https://youtube.com/@mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">▶</span><span>YouTube</span></a>\n      </div>\n      <div class="foot-note">Academic &amp; Research Portfolio <span aria-hidden="true">·</span> © 2026 Mahatab Azmaine Refat</div>\n    </div>\n  </footer>\n\n  '''
          s = s[:start] + contact + s[end:]

          # Remove location and phone only from the embedded CV contact line.
          old_contact = 'Sherpur Sadar, Mymensingh, Bangladesh &amp;nbsp;|&amp;nbsp; +8801999222166 &amp;nbsp;|&amp;nbsp; seoexpertrefat@gmail.com'
          s = s.replace(old_contact, 'seoexpertrefat@gmail.com', 1)

          # Make both hero CTA controls consistent in size and alignment.
          old_base_css = '''.btn{\n    display:inline-flex;align-items:center;\n    padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;\n    font-family:'Roboto',sans-serif;\n    border:1px solid transparent;cursor:pointer;margin:0 12px 10px 0;\n  }'''
          new_base_css = '''.btn{\n    display:inline-flex;align-items:center;justify-content:center;text-align:center;\n    min-width:132px;min-height:40px;padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;\n    font-family:'Roboto',sans-serif;\n    border:1px solid transparent;cursor:pointer;margin:0 12px 10px 0;\n  }'''
          if old_base_css in s:
              s = s.replace(old_base_css, new_base_css, 1)

          css_marker = '/* ---------- FINAL HERO & CONTACT POLISH ---------- */'
          if css_marker not in s:
              css = '''\n  /* ---------- FINAL HERO & CONTACT POLISH ---------- */\n  .hero{position:relative;overflow:hidden;}\n  .hero::before{content:"";position:absolute;width:330px;height:250px;right:18px;top:22px;z-index:0;background:radial-gradient(circle at 35% 42%,rgba(124,166,70,.18),transparent 61%),radial-gradient(circle at 68% 55%,rgba(32,78,107,.17),transparent 62%);filter:blur(18px);border-radius:52% 48% 58% 42%;pointer-events:none;}\n  .hero > div:first-child,.hero-photo{position:relative;z-index:1;}\n  .hero-name-accent{color:var(--blue);}\n  .hero-focus{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;max-width:620px;}\n  .hero-focus span{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.01em;}\n  .hero-focus span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime);margin-right:7px;}\n  .hero-photo{box-shadow:0 0 0 1px var(--line),0 15px 34px rgba(18,24,26,.12);}\n  .hero-photo-wrap{position:relative;}\n  .hero-cta .btn{padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;min-width:132px;min-height:40px;justify-content:center;text-align:center;margin:0 10px 10px 0;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;}\n  .hero-cta .btn:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(18,24,26,.08);}\n  .stat-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}\n  .stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 23px rgba(18,24,26,.07);border-color:#CBD8DC;}\n  .stat-card .num{font-size:28px;font-weight:600;letter-spacing:-.03em;}\n  .stat-card svg{width:66px;height:24px;right:15px;bottom:14px;opacity:.72;}\n  .stat-card svg path{fill:none;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;}\n  .stat-card svg path[stroke]{stroke:var(--lime);}\n  .stat-card svg circle{opacity:.55;}\n  @media (max-width:700px){.hero::before{right:-80px;top:70px;width:290px;height:220px}.hero-focus{gap:6px;margin-top:16px}.hero-focus span{font-size:10px;padding:5px 9px}.hero-cta .btn{padding:8px 13px;min-width:120px;}}\n  @media (prefers-reduced-motion:reduce){.hero-cta .btn,.stat-card{transition:none;}}\n  '''
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit verified result
        run: |
          if git diff --quiet -- index.html; then
            echo "Hero, contact, CV privacy and buttons already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize professional hero and contact sections [hero-contact-final]"
          git push
