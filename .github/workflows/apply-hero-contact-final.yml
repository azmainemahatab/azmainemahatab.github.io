name: Apply final hero and contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hero-contact-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Hero and Contact
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hero = '''      <div class="eyebrow">Health Science × Botany × Digital Growth</div>\n      <h1>Mahatab Azmaine Refat</h1>\n      <div class="tagline">Health Science &amp; Botany student building measurable growth — in research, in learning, and in the audiences I teach online.</div>\n      <div class="hero-cta">\n        <button type="button" class="btn btn-primary" id="viewCvBtn">View CV</button>\n        <a href="#contact" class="btn btn-ghost">Get in Touch</a>\n      </div>'''
          new_hero = '''      <div class="eyebrow">Health Science • Botany • Public Health • Research</div>\n      <h1>Mahatab Azmaine Refat</h1>\n      <div class="tagline">Interdisciplinary academic and research portfolio exploring the intersection of human health, plant science, public health, environmental health, and evidence-based practice.</div>\n      <div class="hero-focus" aria-label="Academic focus areas">\n        <span>Health Science</span><span>Botany</span><span>Public Health</span><span>Research</span>\n      </div>\n      <div class="hero-cta">\n        <button type="button" class="btn btn-primary" id="viewCvBtn">View CV</button>\n        <a href="#contact" class="btn btn-ghost">Get in Touch</a>\n      </div>'''
          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)
          elif 'Interdisciplinary academic and research portfolio exploring' not in s:
              raise SystemExit('Hero block not found; refusing to modify.')

          start = s.find('  <!-- CONTACT -->')
          end = s.find('<!-- ---------- EMBEDDED CV PREVIEW ---------- -->')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Contact section markers not found; refusing to modify.')
          contact = '''  <!-- CONTACT -->\n  <footer id="contact">\n    <div class="contact-shell">\n      <div class="contact-kicker">CONTACT</div>\n      <h2>Let’s Connect</h2>\n      <p class="contact-intro">Open to academic collaboration, research opportunities, internships, and professional conversations across health science, public health, and related fields.</p>\n      <div class="contact-row">\n        <a class="contact-pill contact-primary" href="mailto:seoexpertrefat@gmail.com"><span class="contact-icon">✉</span><span>Email</span></a>\n        <a class="contact-pill" href="https://www.linkedin.com/in/mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">in</span><span>LinkedIn</span></a>\n        <a class="contact-pill" href="https://youtube.com/@mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">▶</span><span>YouTube</span></a>\n      </div>\n      <div class="foot-note">Academic &amp; Research Portfolio <span aria-hidden="true">·</span> © 2026 Mahatab Azmaine Refat</div>\n    </div>\n  </footer>\n\n  '''
          s = s[:start] + contact + s[end:]

          css_marker = '/* ---------- FINAL HERO & CONTACT POLISH ---------- */'
          if css_marker not in s:
              css = '''\n  /* ---------- FINAL HERO & CONTACT POLISH ---------- */\n  .hero-focus{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;max-width:620px;}\n  .hero-focus span{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.01em;}\n  .hero-focus span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime);margin-right:7px;}\n  @media (max-width:700px){.hero-focus{gap:6px;margin-top:16px}.hero-focus span{font-size:10px;padding:5px 9px}}\n  '''
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit verified result
        run: |
          if git diff --quiet -- index.html; then
            echo "Hero and contact already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize professional hero and contact sections [hero-contact-final]"
          git push
