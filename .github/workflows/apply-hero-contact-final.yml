name: Apply final hero and contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hero-contact-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Hero, Contact, CV Privacy and Buttons
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # CV privacy: remove location and phone only from embedded CV contact line.
          old_contact = 'Sherpur Sadar, Mymensingh, Bangladesh &amp;nbsp;|&amp;nbsp; +8801999222166 &amp;nbsp;|&amp;nbsp; seoexpertrefat@gmail.com'
          s = s.replace(old_contact, 'seoexpertrefat@gmail.com', 1)

          # Make the two hero CTA controls consistent in size and alignment.
          old_base_css = '''  .btn{\n    display:inline-flex;align-items:center;\n    padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;\n    font-family:'Roboto',sans-serif;\n    border:1px solid transparent;cursor:pointer;margin:0 12px 10px 0;\n  }'''
          new_base_css = '''  .btn{\n    display:inline-flex;align-items:center;justify-content:center;text-align:center;\n    min-width:132px;min-height:40px;padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;\n    font-family:'Roboto',sans-serif;\n    border:1px solid transparent;cursor:pointer;margin:0 12px 10px 0;\n  }'''
          if old_base_css in s:
              s = s.replace(old_base_css, new_base_css, 1)
          else:
              print('Base button CSS already updated or not found.')

          p.write_text(s, encoding='utf-8')
      - name: Commit verified result
        run: |
          if git diff --quiet -- index.html; then
            echo "CV privacy and hero buttons already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize professional hero and contact sections [hero-contact-final]"
          git push
