name: Add Official Contact Icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace contact placeholders with SVG icons
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'data-official-contact-icons="v1"' in s:
              print('Official contact icons already applied; nothing to do.')
              raise SystemExit(0)

          icons = {
              'email': '''<svg class="contact-svg contact-svg-email" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 5.5h17A1.5 1.5 0 0 1 22 7v10a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 17V7a1.5 1.5 0 0 1 1.5-1.5Zm0 2.2 8.5 6.05 8.5-6.05V7l-8.5 6.05L3.5 7v.7Z"/></svg>''',
              'linkedin': '''<svg class="contact-svg contact-svg-linkedin" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.2 8.2H3.1V21h3.1V8.2ZM4.65 3A1.85 1.85 0 1 0 4.65 6.7 1.85 1.85 0 0 0 4.65 3ZM21 13.65c0-3.86-2.06-5.66-4.82-5.66-2.22 0-3.22 1.22-3.78 2.08V8.2H9.3V21h3.1v-6.34c0-1.67.32-3.29 2.39-3.29 2.04 0 2.07 1.91 2.07 3.4V21H21v-7.35Z"/></svg>''',
              'youtube': '''<svg class="contact-svg contact-svg-youtube" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M23.5 6.2a3.1 3.1 0 0 0-2.18-2.2C19.4 3.5 12 3.5 12 3.5s-7.4 0-9.32.5A3.1 3.1 0 0 0 .5 6.2 32.4 32.4 0 0 0 0 12a32.4 32.4 0 0 0 .5 5.8 3.1 3.1 0 0 0 2.18 2.2c1.92.5 9.32.5 9.32.5s7.4 0 9.32-.5a3.1 3.1 0 0 0 2.18-2.2A32.4 32.4 0 0 0 24 12a32.4 32.4 0 0 0-.5-5.8ZM9.6 15.7V8.3l6.3 3.7-6.3 3.7Z"/></svg>'''
          }

          def replace_block(m):
              block = m.group(0)
              href = re.search(r'href=["\']([^"\']+)["\']', block, re.I)
              if not href:
                  return block
              u = href.group(1).lower()
              kind = 'email' if 'mailto:' in u else 'linkedin' if 'linkedin.com' in u else 'youtube' if 'youtube.com' in u or 'youtu.be' in u else None
              if not kind:
                  return block
              block = re.sub(r'<span\s+class=["\']contact-icon["\'][^>]*>.*?</span>', '<span class="contact-icon">'+icons[kind]+'</span>', block, count=1, flags=re.I|re.S)
              return block

          s2 = re.sub(r'<a\b[^>]*class=["\'][^"\']*\bcontact-pill\b[^"\']*["\'][\s\S]*?</a>', replace_block, s, flags=re.I)

          marker = '<!-- data-official-contact-icons="v1" -->'
          if s2 != s:
              s2 = s2.replace('</style>', '''\n.contact-svg{width:15px;height:15px;display:block;fill:currentColor;}\n.contact-svg-email{width:16px;height:16px;}\n.contact-svg-linkedin{width:15px;height:15px;}\n.contact-svg-youtube{width:16px;height:16px;}\n''' + '</style>', 1)
              s2 = s2.replace('<body>', '<body>\n'+marker, 1)
              p.write_text(s2, encoding='utf-8')
              print('Official contact icons applied.')
          else:
              print('No matching contact pills found; leaving file unchanged.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use official SVG icons in contact section"
          git push