name: Hide phone from public CV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redact-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove phone number from embedded CV
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Sherpur Sadar, Mymensingh, Bangladesh &amp;nbsp;|&amp;nbsp; +8801999222166 &amp;nbsp;|&amp;nbsp; seoexpertrefat@gmail.com'
          new = 'Sherpur Sadar, Mymensingh, Bangladesh &amp;nbsp;|&amp;nbsp; seoexpertrefat@gmail.com'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          else:
              print('Phone string already removed or not found; no content change needed.')
          PY

      - name: Commit CV privacy update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Hide phone number from public CV'
            git push
          fi
          rm -f .github/workflows/hide-cv-phone.yml
          git add .github/workflows/hide-cv-phone.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary CV privacy workflow'
            git push
          fi
