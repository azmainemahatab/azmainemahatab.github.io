name: Finalize CV privacy and hero buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[cv-privacy-buttons-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update CV privacy and hero buttons
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_contact = 'Sherpur Sadar, Mymensingh, Bangladesh &amp;nbsp;|&amp;nbsp; +8801999222166 &amp;nbsp;|&amp;nbsp; seoexpertrefat@gmail.com'
          new_contact = 'seoexpertrefat@gmail.com'
          if old_contact in s:
              s = s.replace(old_contact, new_contact)
          else:
              print('CV location/phone contact line already removed or not found.')

          old_css = '.hero-cta .btn{padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;margin-right:10px;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;}'
          new_css = '.hero-cta{align-items:center;gap:0;}\n  .hero-cta .btn{padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;min-width:120px;min-height:40px;justify-content:center;margin:0 10px 10px 0;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;}'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          elif '.hero-cta .btn{padding:9px 14px' in s:
              print('Hero button styling already finalized.')
          else:
              raise SystemExit('Expected hero button CSS not found; refusing to modify.')

          p.write_text(s, encoding='utf-8')

      - name: Commit verified result and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Finalize CV privacy and hero buttons [cv-privacy-buttons-final]'
          git rm .github/workflows/finalize-cv-privacy-buttons.yml
          git commit -m 'Remove temporary CV privacy workflow [cv-privacy-buttons-final]'
          git push
