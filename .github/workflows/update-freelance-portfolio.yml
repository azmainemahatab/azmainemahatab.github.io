name: Update Portfolio Sections

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-freelance-portfolio.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update portfolio sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace the existing Freelance Portfolio section without creating duplicates.
          marker = '<!-- FREELANCE PORTFOLIO -->'
          start = s.find(marker)
          if start == -1:
              raise SystemExit('FREELANCE PORTFOLIO marker not found')
          sec_start = s.find('<section id="freelance">', start)
          sec_end = s.find('</section>', sec_start)
          if sec_start == -1 or sec_end == -1:
              raise SystemExit('Freelance section boundaries not found')
          sec_end += len('</section>')

          new_section = '''<!-- FREELANCE PORTFOLIO -->
          <section id="freelance">
            <div class="section-head">
              <div class="section-kicker">Freelance Portfolio</div>
              <h2>Projects &amp; Case Studies</h2>
            </div>
            <p class="freelance-intro">A selection of freelance projects, self-directed work, and case studies across SEO, WordPress, digital marketing, and online growth.</p>
            <div class="freelance-services" aria-label="Freelance services">
              <span>SEO &amp; Search Optimization</span><span>WordPress</span><span>Digital Marketing</span><span>Website Optimization</span><span>Content Strategy</span>
            </div>
            <div class="soon-card" id="freelance-public-state">
              <div class="soon-icon" aria-hidden="true">🚧</div>
              <div class="freelance-status">WORK IN PROGRESS</div>
              <h3>Selected Projects Coming Soon</h3>
              <p>I’m currently documenting selected freelance projects, practical work, and case studies. Public case studies will be added here as projects are completed and ready to share.</p>
              <div class="soon-dots" aria-hidden="true"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span></span><span></span></div>
              <a href="#contact" class="btn btn-primary">Want to Work Together? Get in Touch</a>
            </div>
            <div class="freelance-private-preview" id="freelance-private-preview" hidden>
              <div class="private-preview-head"><div><div class="section-kicker">Private Draft Workspace</div><h3>Freelance Portfolio Drafts</h3><p>Draft cards are stored only in this browser. They are not published to the website.</p></div><button type="button" class="btn btn-ghost" id="freelance-preview-close">Close Preview</button></div>
              <div id="freelance-draft-grid" class="freelance-project-grid"></div>
              <p class="private-preview-note">Public visitors continue to see only the Coming Soon state above. Draft content is kept in browser storage and is not included in the public HTML.</p>
            </div>
          </section>'''
          s = s[:sec_start] + new_section + s[sec_end:]

          # Add the international professional-development section directly after Academic Achievements and before Certifications.
          international_marker = '<!-- INTERNATIONAL PROGRAMS & PROFESSIONAL DEVELOPMENT -->'
          s = re.sub(r'\s*' + re.escape(international_marker) + r'.*?</section>\s*', '\n', s, count=1, flags=re.S)
          match = re.search(r'<section\b[^>]*>.*?<h2[^>]*>\s*Academic Achievements\s*</h2>.*?</section>', s, flags=re.S|re.I)
          if not match:
              raise SystemExit('Academic Achievements section not found')

          international_section = '''
          <!-- INTERNATIONAL PROGRAMS & PROFESSIONAL DEVELOPMENT -->
          <section id="international-programs">
            <div class="section-head">
              <div class="section-kicker">International Programs &amp; Professional Development</div>
              <h2>International Programs &amp; Professional Development</h2>
            </div>
            <div class="entry">
              <div class="entry-top">
                <div><span class="entry-title">OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC</span></div>
                <span class="entry-date">Aug 26, 2026</span>
              </div>
              <div class="entry-org">Online Professional English Network (OPEN)</div>
              <div class="entry-desc">International professional development program sponsored by the U.S. Department of State, focused on teaching English academic writing to speakers of other languages.</div>
              <span class="tag">U.S. Department of State–Sponsored Program</span>
            </div>
          </section>'''
          s = s[:match.end()] + international_section + s[match.end():]

          # Keep About paragraphs justified at every viewport.
          s = s.replace('.about-block p{text-align:left;}', '.about-block p{text-align:justify;text-justify:inter-word;hyphens:auto;overflow-wrap:break-word;}')
          s = s.replace('.about-block p{color:var(--ink-soft);font-size:15px;text-align:justify;}', '.about-block p{color:var(--ink-soft);font-size:15px;text-align:justify;text-justify:inter-word;hyphens:auto;overflow-wrap:break-word;}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate portfolio structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if s.count('id="freelance"') != 1:
              raise SystemExit('Duplicate freelance section detected')
          if s.count('<!-- FREELANCE PORTFOLIO -->') != 1:
              raise SystemExit('Duplicate freelance marker detected')
          if 'Projects &amp; Case Studies' not in s:
              raise SystemExit('Freelance heading missing')
          if 'Selected Projects Coming Soon' not in s:
              raise SystemExit('Public coming-soon state missing')
          if s.count('id="international-programs"') != 1:
              raise SystemExit('International Programs section missing or duplicated')
          if 'OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC' not in s:
              raise SystemExit('OPEN certificate entry missing')
          if 'U.S. Department of State' not in s:
              raise SystemExit('Department of State attribution missing')
          a=re.search(r'<section\b[^>]*>.*?<h2[^>]*>\s*Academic Achievements\s*</h2>.*?</section>',s,re.S|re.I)
          i=s.find('<section id="international-programs">')
          c=s.find('<section id="certifications">')
          if not a or i < a.end():
              raise SystemExit('International section is not after Academic Achievements')
          if c != -1 and i > c:
              raise SystemExit('International section is not before Certifications')
          if '.about-block p{text-align:justify;text-justify:inter-word;hyphens:auto;overflow-wrap:break-word;}' not in s:
              raise SystemExit('About justification rule missing')
          print('Validation passed')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add international professional development section"
          git push
