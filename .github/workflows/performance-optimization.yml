name: Portfolio Performance Optimization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[performance-optimized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe performance optimizations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the visual design and content unchanged; optimize only loading/rendering behavior.
          s = s.replace('family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap', 'family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap')

          # Images below the fold: lazy load + async decode. Preserve the hero image eagerly.
          def optimize_img(m):
              tag = m.group(0)
              if 'hero-photo' in tag or 'loading=' in tag:
                  return tag
              if 'loading=' not in tag:
                  tag = tag[:-1] + ' loading="lazy" decoding="async">'
              elif 'decoding=' not in tag:
                  tag = tag[:-1] + ' decoding="async">'
              return tag
          s = re.sub(r'<img\b[^>]*>', optimize_img, s, flags=re.I)

          # The CV iframe is not needed for initial rendering.
          s = re.sub(r'(<iframe\b[^>]*)(>)', lambda m: m.group(1) + (' loading="lazy"' if 'loading=' not in m.group(1) else '') + m.group(2), s, flags=re.I)

          # Make the browser render long sections only when approaching the viewport.
          marker = '/* Performance-only rendering optimization */'
          if marker not in s:
              css = '\n  /* Performance-only rendering optimization */\n  @media (min-width:701px){section{content-visibility:auto;contain-intrinsic-size:1px 520px;}}\n'
              s = s.replace('</style>', css + '</style>', 1)

          # Avoid parser-blocking inline scripts where possible by scheduling existing startup work.
          # Do not alter functionality; only add a small idle hint for non-critical work.
          marker_js = 'PERFORMANCE_IDLE_HINT_V1'
          if marker_js not in s:
              js = '''\n<script>/* PERFORMANCE_IDLE_HINT_V1 */\n(function(){var run=function(){document.documentElement.classList.add('perf-ready')};if('requestIdleCallback' in window){requestIdleCallback(run,{timeout:1200})}else{setTimeout(run,1200)}})();\n</script>\n'''
              s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          test -s index.html
          grep -q 'Performance-only rendering optimization' index.html
          grep -q 'PERFORMANCE_IDLE_HINT_V1' index.html
          grep -q 'seoexpertrefat@gmail.com' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/performance-optimization.yml
          git add index.html .github/workflows/performance-optimization.yml
          git diff --cached --quiet && exit 0
          git commit -m "Optimize portfolio performance [performance-optimized]"
          git push
