name: Restore portfolio email

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-email:
    if: ${{ !contains(github.event.head_commit.message, '[email-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original portfolio email and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'seoexpertmahatabazmaine@gmail.com'
          new = 'rifatmahtab107@gmail.com'
          if old not in s:
              raise SystemExit('Expected old email was not found; no file was changed.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/restore-portfolio-email.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-portfolio-email.yml
          git commit -m "Restore portfolio email [email-restored]"
          git push
