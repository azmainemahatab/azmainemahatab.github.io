name: Fix Freelance Preview Script Markup

on:
  push:
    paths:
      - .github/workflows/fix-freelance-js-markup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wrap private preview code in script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '// ---------- PRIVATE FREELANCE PREVIEW ----------'

          if marker not in s:
              raise SystemExit('Private freelance preview code not found')

          # The previous update inserted the JavaScript directly before </body>.
          # Browsers therefore rendered it as visible page text. Wrap only this
          # final private-preview block in a real script element.
          start = s.find(marker)
          end = s.find('</body>', start)
          if end == -1:
              raise SystemExit('Closing body tag not found')

          block = s[start:end]
          # Remove an accidental script wrapper if one already exists.
          block = re.sub(r'^\s*<script[^>]*>\s*', '', block, count=1, flags=re.I)
          block = re.sub(r'\s*</script>\s*$', '', block, count=1, flags=re.I)
          wrapped = '\n<script>\n' + block.strip() + '\n</script>\n'
          s = s[:start] + wrapped + s[end:]

          # Validation: no visible JS marker outside the script element.
          if s.count(marker) != 1:
              raise SystemExit('Unexpected duplicate preview marker')
          script_start = s.rfind('<script>', 0, s.find(marker) + 1)
          script_end = s.find('</script>', s.find(marker))
          if script_start == -1 or script_end == -1:
              raise SystemExit('Preview code is not inside script tags')
          if s.find(marker) < script_start or s.find(marker) > script_end:
              raise SystemExit('Preview marker is outside script element')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/fix-freelance-js-markup.yml
          git commit -m "Fix visible freelance preview JavaScript"
          git push
