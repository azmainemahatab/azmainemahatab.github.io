name: Final hero and contact polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[hero-contact-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final hero and contact sections
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Upgrade the existing hero copy without changing the photo, layout, or CTA structure.
          old_tagline = 'Health Science &amp; Botany student building measurable growth — in research, in learning, and in the audiences I teach online.'
          new_tagline = 'Interdisciplinary academic and research portfolio exploring human health, plant science, public health, environmental health, and evidence-based practice.'
          if old_tagline in s:
              s = s.replace(old_tagline, new_tagline, 1)

          old_eyebrow = 'Health Science × Botany × Digital Growth'
          new_eyebrow = 'HEALTH SCIENCE · BOTANY · PUBLIC HEALTH · RESEARCH'
          if old_eyebrow in s:
              s = s.replace(old_eyebrow, new_eyebrow, 1)

          # Add a compact credibility line beneath the existing CTAs.
          if 'class="hero-focus"' not in s:
              anchor = '      </div>\n    </div>\n    <img class="hero-photo"'
              insert = '''      </div>\n      <div class="hero-focus" aria-label="Academic focus">\n        <span>Health Science</span><span>Botany</span><span>Public Health</span><span>Research</span>\n      </div>\n    </div>\n    <img class="hero-photo"'''
              if anchor not in s:
                  raise SystemExit('Hero insertion anchor not found; refusing to modify file.')
              s = s.replace(anchor, insert, 1)

          # Replace the existing contact section only when its markers are present.
          start = s.find('  <!-- CONTACT -->')
          end = s.find('<!-- ---------- EMBEDDED CV PREVIEW ---------- -->')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Contact section markers not found; refusing to modify file.')

          contact = '''  <!-- CONTACT -->
          <footer id="contact">
            <div class="contact-shell">
              <div class="contact-kicker">CONTACT</div>
              <h2>Let’s Connect</h2>
              <p class="contact-intro">Open to academic collaboration, research opportunities, internships, and professional conversations across health science, public health, and related fields.</p>
              <div class="contact-row">
                <a class="contact-pill contact-primary" href="mailto:seoexpertrefat@gmail.com"><span class="contact-icon">✉</span><span>Email</span></a>
                <a class="contact-pill" href="https://www.linkedin.com/in/mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">in</span><span>LinkedIn</span></a>
                <a class="contact-pill" href="https://youtube.com/@mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">▶</span><span>YouTube</span></a>
              </div>
              <div class="foot-note">Dhaka, Bangladesh <span aria-hidden="true">·</span> © 2026 Mahatab Azmaine Refat</div>
            </div>
          </footer>

          '''
          s = s[:start] + contact + s[end:]

          # Fix any accidental duplicated visible name.
          s = s.replace('Study Abroad with Mahatab Mahatab Azmaine Refat', 'Study Abroad with Mahatab Azmaine Refat')

          marker = '/* ---------- FINAL HERO + CONTACT POLISH ---------- */'
          if marker not in s:
              css = '''
          /* ---------- FINAL HERO + CONTACT POLISH ---------- */
          .hero-focus{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;}
          .hero-focus span{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-soft);font-size:11.5px;font-weight:600;}
          .hero-focus span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime);margin-right:6px;}
          #contact{padding:72px 0 54px;text-align:center;border-top:1px solid var(--line);}
          .contact-shell{max-width:820px;margin:0 auto;}
          .contact-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;font-weight:600;color:var(--blue);margin-bottom:10px;}
          #contact h2{font-size:40px;line-height:1.12;margin-bottom:12px;}
          .contact-intro{max-width:680px;margin:0 auto 28px;color:var(--ink-soft);font-size:15px;}
          .contact-row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:0 auto 24px;}
          .contact-pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin:0;min-width:132px;padding:11px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(18,24,26,.05);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
          .contact-pill:hover{transform:translateY(-3px);border-color:rgba(32,78,107,.32);box-shadow:0 10px 24px rgba(18,24,26,.10);text-decoration:none;}
          .contact-primary{border-color:rgba(32,78,107,.28);}
          .contact-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#EEF3EE;color:var(--blue);font-size:12px;font-weight:700;line-height:1;}
          .contact-primary .contact-icon{font-size:14px;}
          .foot-note{margin-top:22px;font-size:12px;color:var(--ink-soft);}
          html.dark .contact-icon{background:#202B2F;}
          @media (max-width:700px){.hero-focus{gap:6px;margin-top:14px}.hero-focus span{font-size:10.5px;padding:4px 8px}#contact{padding:58px 0 44px;}#contact h2{font-size:32px}.contact-intro{font-size:14px;padding:0 10px}.contact-row{gap:9px}.contact-pill{min-width:118px;padding:10px 14px}}
          @media (prefers-reduced-motion:reduce){.contact-pill{transition:none}.contact-pill:hover{transform:none}}
          '''
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify final result
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Interdisciplinary academic and research portfolio',
              'class="hero-focus"',
              'Let’s Connect',
              'seoexpertrefat@gmail.com',
              'https://www.linkedin.com/in/mahatabazmaine',
              'https://youtube.com/@mahatabazmaine',
              '/favicon.svg?v=2'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Verification failed: ' + ', '.join(missing))
          if 'contact-pill' in s and 'github.com/azmainemahatab' in s:
              # GitHub may remain in structured metadata; ensure it is not a Contact button.
              contact = s[s.find('  <!-- CONTACT -->'):s.find('<!-- ---------- EMBEDDED CV PREVIEW ---------- -->')]
              if 'github.com/azmainemahatab' in contact:
                  raise SystemExit('Verification failed: GitHub remains in Contact section.')
          print('Hero, Contact, email, social links, favicon, and Contact GitHub exclusion verified.')

      - name: Commit final result
        run: |
          if git diff --quiet -- index.html; then
            echo "No hero/contact changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize professional hero and contact sections [hero-contact-final]"
          git push
