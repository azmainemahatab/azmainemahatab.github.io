name: Final contact cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[contact-final-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final contact section and name fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('  <!-- CONTACT -->')
          end = s.find('<!-- ---------- EMBEDDED CV PREVIEW ---------- -->')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Contact section markers not found; refusing to modify file.')

          contact = '''  <!-- CONTACT -->
          <footer id="contact">
            <div class="contact-shell">
              <div class="contact-kicker">CONTACT</div>
              <h2>Let’s Connect</h2>
              <p class="contact-intro">Open to research collaborations, internships, and opportunities in public &amp; environmental health.</p>
              <div class="contact-row">
                <a class="contact-pill contact-primary" href="mailto:seoexpertrefat@gmail.com"><span class="contact-icon">✉</span><span>Email</span></a>
                <a class="contact-pill" href="https://www.linkedin.com/in/mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">in</span><span>LinkedIn</span></a>
                <a class="contact-pill" href="https://youtube.com/@mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon">▶</span><span>YouTube</span></a>
              </div>
              <div class="foot-note">Dhaka, Bangladesh <span aria-hidden="true">·</span> © 2026 Mahatab Azmaine Refat</div>
            </div>
          </footer>

          '''

          s = s[:start] + contact + s[end:]

          # Fix the duplicated name in the visible professional-project title.
          s = s.replace('Study Abroad with Mahatab Mahatab Azmaine Refat', 'Study Abroad with Mahatab Azmaine Refat')

          marker = '/* ---------- FINAL CONTACT DESIGN ---------- */'
          if marker not in s:
              css = '''
          /* ---------- FINAL CONTACT DESIGN ---------- */
          #contact{padding:72px 0 54px;text-align:center;border-top:1px solid var(--line);}
          .contact-shell{max-width:820px;margin:0 auto;}
          .contact-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;font-weight:600;color:var(--blue);margin-bottom:10px;}
          #contact h2{font-size:40px;line-height:1.12;margin-bottom:12px;}
          .contact-intro{max-width:650px;margin:0 auto 28px;color:var(--ink-soft);font-size:15px;}
          .contact-row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:0 auto 24px;}
          .contact-pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin:0;min-width:132px;padding:11px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(18,24,26,.05);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;}
          .contact-pill:hover{transform:translateY(-3px);border-color:rgba(32,78,107,.32);box-shadow:0 10px 24px rgba(18,24,26,.10);text-decoration:none;background:var(--card);}
          .contact-primary{border-color:rgba(32,78,107,.28);}
          .contact-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#EEF3EE;color:var(--blue);font-size:12px;font-weight:700;line-height:1;}
          .contact-primary .contact-icon{font-size:14px;}
          .foot-note{margin-top:22px;font-size:12px;color:var(--ink-soft);}
          html.dark .contact-icon{background:#202B2F;}
          @media (max-width:700px){#contact{padding:58px 0 44px;}#contact h2{font-size:32px}.contact-intro{font-size:14px;padding:0 10px}.contact-row{gap:9px}.contact-pill{min-width:118px;padding:10px 14px}}
          @media (prefers-reduced-motion:reduce){.contact-pill{transition:none}.contact-pill:hover{transform:none}}
          '''
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit final result
        run: |
          if git diff --quiet -- index.html; then
            echo "No contact/name changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize professional contact section and name fixes [contact-final-applied]"
          git push
