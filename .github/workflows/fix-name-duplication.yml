name: Fix portfolio name duplication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-name:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicated name
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Mahatab Mahatab Azmaine Refat Refat'
          new = 'Mahatab Azmaine Refat'
          updated = s.replace(old, new)
          if updated == s:
              print('No duplicated name found; nothing to change.')
          else:
              p.write_text(updated, encoding='utf-8')
              print('Duplicated name fixed.')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicated portfolio name"
          git push
