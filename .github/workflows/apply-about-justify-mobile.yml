name: Apply About Paragraph Justify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive justified text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".about-block p{color:var(--ink-soft);font-size:15px;text-align:justify;}\n  @media (max-width:700px){.about-block{flex-basis:100%;}.about-block p{text-align:left;}}"
          new = ".about-block p{color:var(--ink-soft);font-size:15px;text-align:justify;text-justify:inter-word;hyphens:auto;overflow-wrap:break-word;}\n  @media (max-width:700px){.about-block{flex-basis:100%;}.about-block p{text-align:justify;text-justify:inter-word;hyphens:auto;overflow-wrap:break-word;}}"
          if old not in s:
              raise SystemExit('Expected About CSS block not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -n -A2 -B1 '\.about-block p' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'No change required.'; exit 0; }
          git commit -m 'Keep About text justified on mobile'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-about-justify-mobile.yml
          git add .github/workflows/apply-about-justify-mobile.yml
          git commit -m 'Remove temporary typography workflow'
          git push
