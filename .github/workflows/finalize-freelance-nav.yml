name: Finalize Freelance Portfolio Navigation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/finalize-freelance-nav.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Freelance Portfolio navigation and public section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          nav_item = '<li><a href="#freelance">Portfolio</a></li>'
          contact_item = '<li><a href="#contact">Contact</a></li>'
          if nav_item not in s and contact_item in s:
              s = s.replace(contact_item, nav_item + '\n          ' + contact_item, 1)

          marker = '<!-- FREELANCE PORTFOLIO -->'
          sec_start = s.find('<section id="freelance">')
          if sec_start == -1:
              cert_start = s.find('<!-- CERTIFICATIONS -->')
              if cert_start == -1:
                  raise SystemExit('Could not find insertion point')
              sec_start = cert_start
              sec_end = cert_start
          else:
              sec_end = s.find('</section>', sec_start)
              if sec_end == -1:
                  raise SystemExit('Freelance section is malformed')
              sec_end += len('</section>')

          new_section = '''<!-- FREELANCE PORTFOLIO -->
          <section id="freelance">
            <div class="section-head">
              <div class="section-kicker">Freelance Portfolio</div>
              <h2>Projects &amp; Case Studies</h2>
            </div>
            <p class="freelance-intro">A selection of freelance projects, self-directed work, and case studies across SEO, WordPress, digital marketing, and online growth.</p>
            <div class="freelance-services" aria-label="Freelance services">
              <span>SEO &amp; Search Optimization</span><span>WordPress</span><span>Digital Marketing</span><span>Website Optimization</span><span>Content Strategy</span>
            </div>
            <div class="soon-card" id="freelance-public-state">
              <div class="soon-icon" aria-hidden="true">🚧</div>
              <div class="freelance-status">WORK IN PROGRESS</div>
              <h3>Selected Projects Coming Soon</h3>
              <p>I’m currently documenting selected freelance projects, practical work, and case studies. Public case studies will be added here as projects are completed and ready to share.</p>
              <div class="soon-dots" aria-hidden="true"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span></span><span></span></div>
              <a href="#contact" class="btn btn-primary">Want to Work Together? Get in Touch</a>
            </div>
          </section>'''
          s = s[:sec_start] + new_section + s[sec_end:]

          css = '''
          /* ---------- FREELANCE PORTFOLIO ---------- */
          .freelance-intro{color:var(--ink-soft);font-size:15px;max-width:760px;margin:-10px 0 20px;}
          .freelance-services{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
          .freelance-services span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--ink-soft);}
          .freelance-status{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--lime);margin-bottom:8px;font-weight:600;}
          @media (max-width:700px){.freelance-services{gap:6px;}.freelance-services span{font-size:12px;}}
          '''
          if '/* ---------- FREELANCE PORTFOLIO ---------- */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          polish_marker = '/* ---------- FREELANCE PORTFOLIO POLISH V2 ---------- */'
          if polish_marker not in s:
              polish = '''
          /* ---------- FREELANCE PORTFOLIO POLISH V2 ---------- */
          #freelance{padding-top:64px;padding-bottom:44px;}
          #freelance .section-head{margin-bottom:26px;}
          #freelance .freelance-intro{margin:-6px 0 18px;}
          #freelance .freelance-services{margin-bottom:24px;}
          #freelance .soon-card{
            padding:56px 36px 50px;
            border-radius:18px;
            border:1px dashed #D9DEDC;
            box-shadow:0 8px 26px -22px rgba(18,24,26,.28);
          }
          #freelance .soon-icon{font-size:28px;margin-bottom:16px;}
          #freelance .freelance-status{margin-bottom:8px;}
          #freelance .soon-card h3{font-size:23px;line-height:1.25;margin-bottom:10px;}
          #freelance .soon-card p{max-width:650px;line-height:1.62;}
          #freelance .soon-dots{gap:7px;margin:18px 0 20px;}
          #freelance .soon-dots span{width:8px;height:8px;}
          #freelance .soon-card .btn{margin:0;}
          @media (max-width:700px){
            #freelance{padding-top:48px;padding-bottom:36px;}
            #freelance .soon-card{padding:44px 20px 40px;}
            #freelance .soon-card h3{font-size:21px;}
            #freelance .soon-card p{font-size:14px;}
          }
          '''
              s = s.replace('</style>', polish + '\n</style>', 1)

          if s.count('<section id="freelance">') != 1:
              raise SystemExit('Freelance section duplicate/missing')
          if s.count(nav_item) != 1:
              raise SystemExit('Freelance Portfolio nav item duplicate/missing')
          if 'Selected Projects Coming Soon' not in s:
              raise SystemExit('Public Coming Soon state missing')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish freelance portfolio layout"
          git push
