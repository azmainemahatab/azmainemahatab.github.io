name: Finalize Freelance Portfolio Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize freelance navigation and section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove every old freelance section and every old #freelance nav item.
          s=re.sub(r'\s*<!--\s*FREELANCE PORTFOLIO\s*-->\s*<section\s+id=["\']freelance["\'][\s\S]*?</section>', '', s, flags=re.I)
          s=re.sub(r'\s*<section\s+id=["\']freelance["\'][\s\S]*?</section>', '', s, flags=re.I)
          s=re.sub(r'\s*<li>\s*<a\s+href=["\']#freelance["\'][^>]*>.*?</a>\s*</li>', '', s, flags=re.I)

          nav='<li><a href="#freelance">Freelance Portfolio</a></li>'
          contact='<li><a href="#contact">Contact</a></li>'
          if contact not in s: raise SystemExit('Contact nav item missing')
          s=s.replace(contact,nav+'\n          '+contact,1)

          section='''<!-- FREELANCE PORTFOLIO -->
          <section id="freelance">
            <div class="section-head">
              <div class="section-kicker">Freelance Portfolio</div>
              <h2>Projects &amp; Case Studies</h2>
            </div>
            <p class="freelance-intro">A selection of freelance projects, self-directed work, and case studies across SEO, WordPress, digital marketing, and online growth.</p>
            <div class="freelance-services" aria-label="Freelance services">
              <span>SEO &amp; Search Optimization</span><span>WordPress</span><span>Digital Marketing</span><span>Website Optimization</span><span>Content Strategy</span>
            </div>
            <div class="soon-card" id="freelance-public-state">
              <div class="soon-icon" aria-hidden="true">🚧</div>
              <div class="freelance-status">WORK IN PROGRESS</div>
              <h3>Selected Projects Coming Soon</h3>
              <p>I’m currently documenting selected freelance projects, practical work, and case studies. Public case studies will be added here as projects are completed and ready to share.</p>
              <div class="soon-dots" aria-hidden="true"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span></span><span></span></div>
              <a href="#contact" class="btn btn-primary">Want to Work Together? Get in Touch</a>
            </div>
            <div class="freelance-private-preview" id="freelance-private-preview" hidden>
              <div class="private-preview-head"><div><div class="section-kicker">Private Draft Workspace</div><h3>Freelance Portfolio Drafts</h3><p>Draft cards are stored only in this browser. They are not published to the website.</p></div><button type="button" class="btn btn-ghost" id="freelance-preview-close">Close Preview</button></div>
              <div id="freelance-draft-grid" class="freelance-project-grid"></div>
              <p class="private-preview-note">Public visitors continue to see only the Coming Soon state. Draft content stays in this browser's local storage and is not included in the public HTML.</p>
            </div>
          </section>'''
          marker='<!-- CERTIFICATIONS -->'
          pos=s.find(marker)
          if pos<0: raise SystemExit('Certifications marker missing')
          s=s[:pos]+section+'\n\n          '+s[pos:]

          css='''
          /* ---------- FREELANCE PORTFOLIO ---------- */
          .freelance-intro{color:var(--ink-soft);font-size:15px;max-width:760px;margin:-10px 0 20px;}
          .freelance-services{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
          .freelance-services span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--ink-soft);}
          .soon-card{background:var(--card);border:1px dashed #D9DEDC;border-radius:18px;padding:72px 40px 66px;text-align:center;box-shadow:0 10px 30px -24px rgba(18,24,26,.28);}
          .soon-icon{font-size:30px;line-height:1;margin-bottom:22px;}
          .freelance-status{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--lime);font-weight:700;margin-bottom:10px;}
          .soon-card h3{font-family:'Space Grotesk',sans-serif;font-size:24px;margin-bottom:12px;}
          .soon-card p{color:var(--ink-soft);font-size:15px;line-height:1.7;max-width:620px;margin:0 auto;}
          .soon-dots{display:flex;justify-content:center;gap:8px;margin:24px 0 22px;}
          .soon-dots span{width:9px;height:9px;border-radius:50%;background:#E3E7E5;display:block;}
          .soon-dots span.filled{background:var(--lime);}
          .soon-card .btn{margin:0;}
          .freelance-private-preview{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
          .private-preview-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px;}
          .private-preview-head h3{font-size:22px;margin-bottom:5px;}
          .private-preview-head p,.private-preview-note{color:var(--ink-soft);font-size:13.5px;}
          .freelance-project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
          .freelance-project-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
          .freelance-project-card .project-type{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase;margin-bottom:8px;}
          .freelance-project-card h4{font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:8px;}
          .freelance-project-card p{color:var(--ink-soft);font-size:13.5px;margin-bottom:12px;}
          .project-meta{display:flex;flex-wrap:wrap;gap:6px;}
          .project-meta span{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--ink-soft);}
          .private-preview-note{margin-top:18px;}
          @media (max-width:700px){.soon-card{padding:52px 22px 48px;}.soon-card h3{font-size:21px;}.freelance-project-grid{grid-template-columns:1fr;}.private-preview-head{flex-direction:column;}}
          '''
          s=re.sub(r'\s*/\* ---------- FREELANCE PORTFOLIO ---------- \*/[\s\S]*?(?=\n</style>)','',s,count=1)
          s=s.replace('</style>',css+'\n</style>',1)

          if '// ---------- PRIVATE FREELANCE PREVIEW ----------' not in s:
            js='''
          // ---------- PRIVATE FREELANCE PREVIEW ----------
          (function(){
            const key='refat_freelance_drafts_v1',preview=document.getElementById('freelance-private-preview'),pub=document.getElementById('freelance-public-state'),grid=document.getElementById('freelance-draft-grid'),close=document.getElementById('freelance-preview-close');
            if(!preview||!grid)return;
            const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
            function render(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}grid.innerHTML=a.length?a.map(x=>`<article class="freelance-project-card"><div class="project-type">${esc(x.type||'PROJECT')}</div><h4>${esc(x.title||'Untitled Project')}</h4><p>${esc(x.description||'')}</p><div class="project-meta">${(x.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></article>`).join(''):'<p class="private-preview-note">No private drafts are stored in this browser yet.</p>'}
            function open(){preview.hidden=false;pub.hidden=true;render();preview.scrollIntoView({behavior:'smooth',block:'start'})}
            close?.addEventListener('click',()=>{preview.hidden=true;pub.hidden=false});
            if(location.hash==='#freelance-private')open();
          })();
          '''
            s=s.replace('</body>',js+'\n</body>',1)

          assert s.count('<section id="freelance">')==1
          assert s.count(nav)==1
          assert s.count('Projects &amp; Case Studies')==1
          assert s.count('Selected Projects Coming Soon')==1
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/finalize-freelance-nav.yml
          git commit -m "Finalize freelance portfolio navigation and coming soon layout"
          git push
