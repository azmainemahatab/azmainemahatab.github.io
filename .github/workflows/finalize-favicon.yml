name: Finalize professional favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[finalize-favicon]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace favicon reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, count = re.subn(
              r'\s*<link\s+rel=["\']icon["\'][^>]*>',
              '\n<link rel="icon" type="image/svg+xml" href="/favicon.svg">',
              s,
              count=1,
              flags=re.I
          )

          if count == 0:
              s = s.replace('</head>', '  <link rel="icon" type="image/svg+xml" href="/favicon.svg">\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          test -f favicon.svg
          grep -q 'href="/favicon.svg"' index.html
          test "$(grep -io '<link[^>]*rel=["'"']icon["'"'][^>]*>' index.html | wc -l)" -eq 1

      - name: Commit final favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-favicon.yml
          git add index.html favicon.svg .github/workflows/finalize-favicon.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply professional M leaf favicon [finalize-favicon]"
          git push
