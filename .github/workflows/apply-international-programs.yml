name: Apply Unified Portfolio Card System

on:
  push:
    paths:
      - '.github/workflows/apply-international-programs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild credential cards with self-contained certificate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for marker in [
              'unified-credential-card-styles',
              'unified-credential-card-script',
              'certificate-viewer-styles',
              'international-program-card-styles'
          ]:
              s = re.sub(
                  r'\s*<(?:style|script) id="' + re.escape(marker) + r'".*?</(?:style|script)>\s*',
                  '\n', s, count=1, flags=re.S
              )

          s = re.sub(
              r'\s*<!-- INTERNATIONAL PROGRAMS & PROFESSIONAL DEVELOPMENT -->.*?</section>\s*',
              '\n', s, count=1, flags=re.S
          )

          styles = r'''
          <style id="unified-credential-card-styles">
            #research .entry,#certifications .cert-card,.international-program-card{
              background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
              box-shadow:0 10px 28px -22px rgba(18,24,26,.28);overflow:hidden;
            }
            #research .entry{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:28px;padding:20px;margin-bottom:18px;border-top:1px solid var(--line);}
            #research .entry>img{grid-column:1;grid-row:1 / span 3;width:100%;height:230px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;align-self:center;}
            #research .entry>.entry-top,#research .entry>.entry-desc,#research .entry>.tag{grid-column:2;}
            #research .entry>.entry-top{grid-row:1;}#research .entry>.entry-desc{grid-row:2;max-width:none;margin-top:10px;}#research .entry>.tag{grid-row:3;align-self:start;width:max-content;}
            #certifications .cert-featured{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:28px;}
            #certifications .cert-card{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);min-width:0;}
            #certifications .cert-card>img{width:100%;height:190px;object-fit:contain;object-position:center;background:#fff;border-right:1px solid var(--line);border-bottom:none;}
            #certifications .cert-card-body{padding:20px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
            #certifications .cert-card-body .name{font-size:19px;line-height:1.25;}#certifications .cert-card-body .issuer{font-size:14px;margin-top:7px;color:var(--blue);}
            .credential-view-btn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;margin-top:16px;min-height:40px;padding:9px 16px;border:1px solid var(--blue);border-radius:9px;background:var(--card);color:var(--blue);font-family:'Roboto',sans-serif;font-size:14px;font-weight:500;cursor:pointer;}
            .credential-view-btn:hover{background:#F5F8FA;}
            .international-program-card{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:28px;padding:20px;}
            .international-program-card .certificate-preview{width:100%;height:230px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;}
            .international-program-card .certificate-preview svg{width:100%;height:100%;display:block;}
            .international-program-card .program-content{min-width:0;display:flex;flex-direction:column;justify-content:center;}
            .international-program-card .entry-desc{max-width:none;}
            .international-program-card .certificate-action{align-self:flex-start;margin-top:16px;}
            #certificate-viewer-modal[hidden]{display:none;}
            #certificate-viewer-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;}
            .certificate-viewer-backdrop{position:absolute;inset:0;background:rgba(18,24,26,.72);backdrop-filter:blur(4px);}
            .certificate-viewer-panel{position:relative;z-index:1;max-width:min(1100px,94vw);max-height:92vh;background:#fff;border-radius:14px;padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:auto;}
            .certificate-viewer-panel svg{display:block;width:min(100%,900px);height:auto;max-height:84vh;}
            .certificate-viewer-close{position:absolute;top:8px;right:8px;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;z-index:2;}
            @media (max-width:700px){
              #research .entry,#certifications .cert-card,.international-program-card{grid-template-columns:1fr;gap:16px;padding:16px;}
              #research .entry>img{grid-column:1;grid-row:1;height:auto;max-height:320px;}
              #research .entry>.entry-top,#research .entry>.entry-desc,#research .entry>.tag{grid-column:1;}
              #research .entry>.entry-top{grid-row:2;}#research .entry>.entry-desc{grid-row:3;}#research .entry>.tag{grid-row:4;}
              #certifications .cert-card>img{height:auto;max-height:320px;border-right:none;border-bottom:1px solid var(--line);}
              #certifications .cert-card-body{padding:16px;}
              .international-program-card .certificate-preview{height:auto;min-height:260px;}
              .credential-view-btn,.international-program-card .certificate-action{width:100%;}
            }
          </style>
          '''

          certificate_svg = r'''
          <svg class="open-certificate-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1236" role="img" aria-label="OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC certificate">
            <rect width="1600" height="1236" fill="#fff"/>
            <rect x="58" y="58" width="1484" height="1120" fill="#fdfdfd" stroke="#10166f" stroke-width="7"/>
            <text x="800" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#11166f">CERTIFICATE OF AWARD</text>
            <text x="800" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="68" fill="#11166f">Mahatab Azmaine Refat</text>
            <text x="800" y="465" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#263241">has successfully completed</text>
            <text x="800" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#111">OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC</text>
            <text x="800" y="570" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#263241">through the Online Professional English Network</text>
            <text x="800" y="635" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111">Issued: &nbsp; Aug 26, 2026</text>
            <rect x="720" y="690" width="160" height="8" fill="#d7d7d7"/>
            <text x="800" y="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#111">OPEN MOOCs</text>
            <rect x="590" y="780" width="420" height="2" fill="#d0d0d0"/>
            <text x="800" y="815" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#111">ISSUER</text>
            <text x="800" y="970" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#111">The Online Professional English Network is a program</text>
            <text x="800" y="1005" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#111">sponsored by the U.S. Department of State with</text>
            <text x="800" y="1040" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#111">funding provided by the U.S. Government and</text>
            <text x="800" y="1075" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#111">administered by FHI 360.</text>
            <g transform="translate(90 1000)"><rect width="250" height="150" fill="#fff" stroke="#ddd"/><rect y="0" width="250" height="150" fill="#fff"/><rect width="250" height="150" fill="none" stroke="#b22234" stroke-width="18" stroke-dasharray="30 30"/><rect width="100" height="82" fill="#3c3b6e"/><circle cx="20" cy="17" r="3" fill="#fff"/><circle cx="45" cy="30" r="3" fill="#fff"/><circle cx="70" cy="17" r="3" fill="#fff"/><circle cx="25" cy="52" r="3" fill="#fff"/><circle cx="55" cy="65" r="3" fill="#fff"/><circle cx="82" cy="50" r="3" fill="#fff"/></g>
            <g transform="translate(1190 970)"><circle cx="55" cy="45" r="43" fill="#263d78"/><path d="M30 45h50M55 20v50" stroke="#fff" stroke-width="5"/><text x="110" y="62" font-family="Georgia,serif" font-size="70" font-weight="700" fill="#263d78">OPEN</text><text x="112" y="92" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#263d78">Online Professional English Network</text></g>
          </svg>
          '''

          section = f'''
          <!-- INTERNATIONAL PROGRAMS & PROFESSIONAL DEVELOPMENT -->
          <section id="international-programs">
            <div class="section-head"><div class="section-kicker">International Programs &amp; Professional Development</div><h2>International Programs &amp; Professional Development</h2></div>
            <div class="international-program-card">
              <button class="certificate-preview" type="button" aria-label="Open OPEN certificate">{certificate_svg}</button>
              <div class="program-content">
                <div class="entry-top"><div><span class="entry-title">OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC</span></div><span class="entry-date">Aug 26, 2026</span></div>
                <div class="entry-org">Online Professional English Network (OPEN)</div>
                <div class="entry-desc">International professional development program sponsored by the U.S. Department of State, focused on teaching English academic writing to speakers of other languages.</div>
                <button class="btn btn-ghost certificate-action" type="button" aria-label="View OPEN certificate">View Certificate</button>
              </div>
            </div>
          </section>
          '''

          m = re.search(r'<section\b[^>]*>.*?<h2[^>]*>\s*Academic Achievements\s*</h2>.*?</section>', s, flags=re.S|re.I)
          if not m: raise SystemExit('Academic Achievements section not found')
          s = s[:m.end()] + styles + section + s[m.end():]

          script = r'''
          <script id="unified-credential-card-script">
          (function(){
            function openSvg(svg){
              var modal=document.getElementById('certificate-viewer-modal');
              var panel=document.getElementById('certificate-viewer-content');
              if(!modal||!panel||!svg)return;
              panel.innerHTML=svg.outerHTML;
              modal.hidden=false;
              document.body.style.overflow='hidden';
            }
            function closeViewer(){var modal=document.getElementById('certificate-viewer-modal');if(modal){modal.hidden=true;document.body.style.overflow='';}}
            function ensureViewer(){
              if(document.getElementById('certificate-viewer-modal'))return;
              var modal=document.createElement('div');modal.id='certificate-viewer-modal';modal.hidden=true;modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
              modal.innerHTML='<div class="certificate-viewer-backdrop"></div><div class="certificate-viewer-panel"><button type="button" class="certificate-viewer-close" aria-label="Close certificate">×</button><div id="certificate-viewer-content"></div></div>';
              document.body.appendChild(modal);
              modal.querySelector('.certificate-viewer-backdrop').addEventListener('click',closeViewer);
              modal.querySelector('.certificate-viewer-close').addEventListener('click',closeViewer);
              document.addEventListener('keydown',function(e){if(e.key==='Escape')closeViewer();});
            }
            ensureViewer();
            document.querySelectorAll('.international-program-card .certificate-preview,.international-program-card .certificate-action').forEach(function(el){el.addEventListener('click',function(){var svg=document.querySelector('.international-program-card .open-certificate-svg');openSvg(svg);});});
            document.querySelectorAll('#certifications .cert-card').forEach(function(card){if(card.querySelector('.credential-view-btn'))return;var img=card.querySelector('img'),body=card.querySelector('.cert-card-body');if(!img||!body)return;var b=document.createElement('button');b.type='button';b.className='credential-view-btn';b.textContent='View Certificate';b.addEventListener('click',function(){var modal=document.getElementById('certificate-viewer-modal'),panel=document.getElementById('certificate-viewer-content');panel.innerHTML='<img src="'+(img.currentSrc||img.src)+'" alt="'+(img.alt||'Certificate')+'" style="max-width:100%;max-height:84vh;width:auto;height:auto;display:block;"/>';modal.hidden=false;document.body.style.overflow='hidden';});body.appendChild(b);});
            document.querySelectorAll('#research .entry').forEach(function(entry){if(entry.querySelector('.credential-view-btn'))return;var img=entry.querySelector('img');if(!img)return;var b=document.createElement('button');b.type='button';b.className='credential-view-btn';b.textContent='View Certificate';b.addEventListener('click',function(){var modal=document.getElementById('certificate-viewer-modal'),panel=document.getElementById('certificate-viewer-content');panel.innerHTML='<img src="'+(img.currentSrc||img.src)+'" alt="'+(img.alt||'Certificate')+'" style="max-width:100%;max-height:84vh;width:auto;height:auto;display:block;"/>';modal.hidden=false;document.body.style.overflow='hidden';});var d=entry.querySelector('.entry-desc');if(d)d.insertAdjacentElement('afterend',b);});
          })();
          </script>
          '''
          s = re.sub(r'</body>', script + '\n</body>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'one international section': s.count('id="international-programs"') == 1,
            'one unified style': s.count('id="unified-credential-card-styles"') == 1,
            'one viewer script': s.count('id="unified-credential-card-script"') == 1,
            'inline OPEN certificate': s.count('class="open-certificate-svg"') == 1,
            'no broken asset dependency': '/assets/open-certificate.svg' not in s,
            'certifications present': 'class="cert-card"' in s,
            'research present': 'id="research"' in s,
            'academic before international': s.find('Academic Achievements') < s.find('id="international-programs"'),
            'international before certifications': s.find('id="international-programs"') < s.find('id="certifications"'),
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          print('Certificate/card validation passed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix certificate rendering with self-contained SVG"
          git push
