name: Apply International Programs Section

on:
  push:
    paths:
      - '.github/workflows/apply-international-programs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert international programs section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- INTERNATIONAL PROGRAMS & PROFESSIONAL DEVELOPMENT -->'
          s=re.sub(r'\s*'+re.escape(marker)+r'.*?</section>\s*','\n',s,count=1,flags=re.S)
          m=re.search(r'<section\b[^>]*>.*?<h2[^>]*>\s*Academic Achievements\s*</h2>.*?</section>',s,flags=re.S|re.I)
          if not m:
              raise SystemExit('Academic Achievements section not found')
          styles='''\n          <style id="international-program-card-styles">\n            .international-program-card{display:flex;align-items:stretch;gap:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 10px 28px -22px rgba(18,24,26,.28);overflow:hidden;}\n            .international-program-card .certificate-preview{flex:0 0 320px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;}\n            .international-program-card .certificate-preview img{width:100%;height:220px;object-fit:contain;display:block;}\n            .international-program-card .program-content{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}\n            .international-program-card .entry-top{margin-bottom:2px;}\n            .international-program-card .entry-desc{max-width:none;}\n            .international-program-card .certificate-action{align-self:flex-start;margin-top:16px;}\n            @media (max-width:700px){\n              .international-program-card{flex-direction:column;gap:18px;padding:16px;}\n              .international-program-card .certificate-preview{flex-basis:auto;width:100%;}\n              .international-program-card .certificate-preview img{height:auto;max-height:320px;}\n              .international-program-card .certificate-action{width:100%;}\n            }\n          </style>\n          '''
          section='''\n          <!-- INTERNATIONAL PROGRAMS & PROFESSIONAL DEVELOPMENT -->\n          <section id="international-programs">\n            <div class="section-head">\n              <div class="section-kicker">International Programs &amp; Professional Development</div>\n              <h2>International Programs &amp; Professional Development</h2>\n            </div>\n            <div class="international-program-card">\n              <a class="certificate-preview" href="/assets/open-certificate.svg" target="_blank" rel="noopener" aria-label="View OPEN certificate">\n                <img src="/assets/open-certificate.svg" alt="OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC certificate">\n              </a>\n              <div class="program-content">\n                <div class="entry-top">\n                  <div><span class="entry-title">OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC</span></div>\n                  <span class="entry-date">Aug 26, 2026</span>\n                </div>\n                <div class="entry-org">Online Professional English Network (OPEN)</div>\n                <div class="entry-desc">International professional development program sponsored by the U.S. Department of State, focused on teaching English academic writing to speakers of other languages.</div>\n                <a class="btn btn-ghost certificate-action" href="/assets/open-certificate.svg" target="_blank" rel="noopener" aria-label="View OPEN certificate">View Certificate</a>\n              </div>\n            </div>\n          </section>\n          '''
          s=s[:m.end()]+styles+section+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if s.count('id="international-programs"') != 1: raise SystemExit('International section duplicate/missing')
          if 'OPEN Teaching English Academic Writing to Speakers of Other Languages MOOC' not in s: raise SystemExit('OPEN entry missing')
          if s.count('class="certificate-preview"') != 1: raise SystemExit('Certificate preview missing/duplicated')
          if s.count('class="btn btn-ghost certificate-action"') != 1: raise SystemExit('View Certificate button missing/duplicated')
          if '/assets/open-certificate.svg' not in s: raise SystemExit('Certificate image asset missing')
          if 'international-program-card-styles' not in s: raise SystemExit('Card styles missing')
          m=re.search(r'<section\b[^>]*>.*?<h2[^>]*>\s*Academic Achievements\s*</h2>.*?</section>',s,re.S|re.I)
          i=s.find('<section id="international-programs">')
          if not m or i < m.end(): raise SystemExit('Wrong section order')
          c=s.find('<section id="certifications">')
          if c != -1 and i > c: raise SystemExit('International section must precede certifications')
          print('Validation passed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish international program certificate card"
          git push
