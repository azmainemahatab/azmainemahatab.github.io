name: Apply Unified Portfolio Card System

on:
  push:
    paths:
      - '.github/workflows/apply-international-programs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cohesive academic achievement cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove a previous version of this enhancement so the workflow is idempotent.
          s = re.sub(
              r'\s*<style id="academic-achievement-card-styles">.*?</style>\s*',
              '\n', s, count=1, flags=re.S
          )

          academic = '''
          <div class="section-head" style="margin-top:44px;">
            <h2 style="font-size:25px;">Academic Achievements</h2>
          </div>
          <div class="academic-achievement-grid" aria-label="Academic achievements">
            <article class="academic-achievement-card">
              <div class="academic-achievement-main">
                <div class="academic-achievement-icon academic-icon-award" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3h8v6a4 4 0 0 1-8 0V3Z"/><path d="M8 6H5a3 3 0 0 0 3 3M16 6h3a3 3 0 0 1-3 3"/><path d="M12 13v4M9 21h6M10 17h4"/><path d="m9.5 3 .7-1h3.6l.7 1"/>
                  </svg>
                </div>
                <div class="academic-achievement-content">
                  <div class="academic-achievement-title-row">
                    <div>
                      <div class="academic-achievement-title">President's List</div>
                      <div class="academic-achievement-org">University of the People</div>
                    </div>
                  </div>
                  <p>The university's highest academic honor, achieved for four consecutive terms.</p>
                </div>
              </div>
              <div class="academic-achievement-highlight" aria-label="Four consecutive terms">
                <span class="academic-highlight-icon">★</span>
                <strong>04</strong>
                <span>TERMS</span>
                <small>CONSECUTIVE</small>
              </div>
            </article>

            <article class="academic-achievement-card">
              <div class="academic-achievement-main">
                <div class="academic-achievement-icon academic-icon-scholarship" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M7 11.2V16c0 1.7 2.2 3 5 3s5-1.3 5-3v-4.8"/><path d="M21 10v5"/>
                  </svg>
                </div>
                <div class="academic-achievement-content">
                  <div class="academic-achievement-title-row">
                    <div>
                      <div class="academic-achievement-title">Government of Kazakhstan Scholarship</div>
                      <div class="academic-achievement-org">Al-Farabi Kazakh National University</div>
                    </div>
                  </div>
                  <p>Merit-based government scholarship for undergraduate studies in Space Engineering and Technologies.</p>
                </div>
              </div>
              <div class="academic-achievement-highlight" aria-label="Awarded in 2023">
                <span class="academic-highlight-icon">◆</span>
                <strong>2023</strong>
                <span>AWARDED</span>
                <small>SCHOLARSHIP</small>
              </div>
            </article>

            <article class="academic-achievement-card">
              <div class="academic-achievement-main">
                <div class="academic-achievement-icon academic-icon-institutional" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v17H7.5A3.5 3.5 0 0 0 4 22V5.5Z"/><path d="M4 19a3.5 3.5 0 0 1 3.5-3.5H20M9 6h7M9 10h6"/>
                  </svg>
                </div>
                <div class="academic-achievement-content">
                  <div class="academic-achievement-title-row">
                    <div>
                      <div class="academic-achievement-title">University of the People Institutional Scholarship</div>
                      <div class="academic-achievement-org">University of the People</div>
                    </div>
                  </div>
                  <p>Institutional scholarship providing financial support toward my undergraduate education at the University of the People.</p>
                </div>
              </div>
              <div class="academic-achievement-highlight" aria-label="Institutional scholarship">
                <span class="academic-highlight-icon">◇</span>
                <strong>UoP</strong>
                <span>SCHOLARSHIP</span>
                <small>INSTITUTIONAL SUPPORT</small>
              </div>
            </article>
          </div>
          '''

          pattern = re.compile(
              r'<div class="section-head" style="margin-top:44px;">\s*<h2[^>]*>\s*Academic Achievements\s*</h2>\s*</div>.*?</section>',
              re.S | re.I
          )
          if not pattern.search(s):
              raise SystemExit('Academic Achievements section not found')
          s = pattern.sub(academic.rstrip() + '\n  </section>', s, count=1)

          styles = '''
          <style id="academic-achievement-card-styles">
            .academic-achievement-grid{display:grid;gap:18px;}
            .academic-achievement-card{
              display:grid;grid-template-columns:minmax(0,1fr) 220px;align-items:stretch;
              background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
              overflow:hidden;box-shadow:0 10px 28px -22px rgba(18,24,26,.28);
              transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
            }
            .academic-achievement-card:hover{
              transform:translateY(-3px);border-color:rgba(32,78,107,.24);
              box-shadow:0 14px 32px -20px rgba(18,24,26,.25);
            }
            .academic-achievement-main{display:flex;gap:22px;align-items:center;padding:24px 26px;min-width:0;}
            .academic-achievement-icon{
              width:76px;height:76px;flex:0 0 76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
              background:#EEF3EE;color:var(--blue);border:1px solid rgba(32,78,107,.08);
            }
            .academic-achievement-icon svg{width:34px;height:34px;}
            .academic-icon-scholarship{color:#247A66;background:#EEF7F3;}
            .academic-icon-institutional{color:#6246B5;background:#F3F0FB;}
            .academic-achievement-content{min-width:0;}
            .academic-achievement-title{font-family:'Space Grotesk',sans-serif;font-size:20px;line-height:1.25;font-weight:700;color:var(--ink);}
            .academic-achievement-org{font-size:14.5px;color:var(--blue);margin-top:6px;}
            .academic-achievement-content p{font-size:14.5px;line-height:1.65;color:var(--ink-soft);margin-top:12px;max-width:700px;}
            .academic-achievement-highlight{
              display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
              padding:20px 16px;background:#F5F7FC;border-left:1px solid var(--line);color:var(--blue);
            }
            .academic-achievement-card:nth-child(2) .academic-achievement-highlight{background:#F1F8F5;color:#247A66;}
            .academic-achievement-card:nth-child(3) .academic-achievement-highlight{background:#F5F2FC;color:#6246B5;}
            .academic-highlight-icon{font-size:16px;line-height:1;margin-bottom:7px;opacity:.9;}
            .academic-achievement-highlight strong{font-family:'Space Grotesk',sans-serif;font-size:42px;line-height:1;font-weight:700;letter-spacing:-.02em;}
            .academic-achievement-highlight>span:not(.academic-highlight-icon){font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;margin-top:7px;}
            .academic-achievement-highlight small{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;margin-top:15px;padding-top:9px;border-top:1px solid currentColor;opacity:.72;}
            html.dark .academic-achievement-icon{background:#202B2F;border-color:#2A3134;}
            html.dark .academic-icon-scholarship{background:#20332F;}
            html.dark .academic-icon-institutional{background:#29243A;}
            html.dark .academic-achievement-highlight{background:#18232A;}
            html.dark .academic-achievement-card:nth-child(2) .academic-achievement-highlight{background:#1B2A27;}
            html.dark .academic-achievement-card:nth-child(3) .academic-achievement-highlight{background:#272137;}
            @media (max-width:700px){
              .academic-achievement-card{grid-template-columns:1fr;}
              .academic-achievement-main{padding:20px;gap:16px;align-items:flex-start;}
              .academic-achievement-icon{width:58px;height:58px;flex-basis:58px;}
              .academic-achievement-icon svg{width:28px;height:28px;}
              .academic-achievement-title{font-size:18px;}
              .academic-achievement-content p{font-size:14px;margin-top:10px;}
              .academic-achievement-highlight{border-left:none;border-top:1px solid var(--line);min-height:112px;padding:16px;}
              .academic-achievement-highlight strong{font-size:34px;}
              .academic-achievement-highlight small{margin-top:10px;padding-top:7px;}
            }
            @media (prefers-reduced-motion:reduce){.academic-achievement-card{transition:none}.academic-achievement-card:hover{transform:none;}}
          </style>
          '''
          marker='<!-- ACADEMIC ACHIEVEMENT CARD STYLES -->'
          if marker not in s:
              s=s.replace('</head>', marker+'\n'+styles+'\n</head>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'one academic section': s.count('>Academic Achievements</h2>') == 1,
            'three academic cards': s.count('class="academic-achievement-card"') == 3,
            'academic style present': s.count('id="academic-achievement-card-styles"') == 1,
            'presidents list present': "President's List" in s,
            'kazakhstan scholarship present': 'Government of Kazakhstan Scholarship' in s,
            'institutional scholarship present': 'University of the People Institutional Scholarship' in s,
            'international section present': s.count('id="international-programs"') == 1,
            'certifications present': 'class="cert-card"' in s,
            'research present': 'id="research"' in s,
            'academic before international': s.find('Academic Achievements') < s.find('id="international-programs"'),
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          print('Academic achievement card validation passed')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine academic achievement cards"
          git push
