name: Update CV and Hero Buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update index.html through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/contents/index.html" --jq '.content' | tr -d '\n' | base64 -d > index.html

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_contact = 'Sherpur Sadar, Mymensingh, Bangladesh &amp;nbsp;|&amp;nbsp; +8801999222166 &amp;nbsp;|&amp;nbsp; seoexpertrefat@gmail.com'
          new_contact = 'seoexpertrefat@gmail.com'
          if old_contact in s:
              s = s.replace(old_contact, new_contact, 1)
          else:
              print('CV location/phone line already removed or not found.')

          old_css = """.btn{\n    display:inline-flex;align-items:center;\n    padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;\n    font-family:'Roboto',sans-serif;\n    border:1px solid transparent;cursor:pointer;margin:0 12px 10px 0;\n  }"""
          new_css = """.btn{\n    display:inline-flex;align-items:center;justify-content:center;text-align:center;\n    min-width:132px;padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;\n    font-family:'Roboto',sans-serif;\n    border:1px solid transparent;cursor:pointer;margin:0 12px 10px 0;\n  }"""
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          elif 'justify-content:center;text-align:center' not in s:
              raise SystemExit('Expected hero button CSS was not found; refusing to modify.')

          p.write_text(s, encoding='utf-8')
          PY

          CONTENT=$(base64 -w 0 index.html)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/index.html" --jq '.sha')
          gh api "repos/${GITHUB_REPOSITORY}/contents/index.html" \
            -X PUT \
            -f message='Fix hero buttons and remove CV contact details' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main' >/dev/null

      - name: Remove temporary workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/update-cv-buttons.yml" --jq '.sha')
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/update-cv-buttons.yml" \
            -X DELETE \
            -f message='Remove temporary CV update workflow' \
            -f sha="$SHA" \
            -f branch='main' >/dev/null
