name: Apply final portfolio update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-final-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navbar and email update
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_email = 'rifatmahtab107@gmail.com'
          new_email = 'seoexpertrefat@gmail.com'
          s = s.replace(old_email, new_email)
          marker = '/* ---------- MODERN HAMBURGER NAV FINAL ---------- */'
          if marker not in s:
              css = '''\n  /* ---------- MODERN HAMBURGER NAV FINAL ---------- */\n  nav{background:rgba(251,251,249,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}\n  .nav-inner{max-width:1280px;padding:12px 28px;}\n  .nav-actions{margin-left:auto;position:relative;}\n  .nav-links{display:none;position:absolute;top:calc(100% + 12px);right:0;width:250px;padding:8px;flex-direction:column;align-items:stretch;gap:2px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(18,24,26,.16);list-style:none;z-index:100;}\n  .nav-links.open{display:flex;}\n  .nav-links li + li{margin-left:0;}\n  .nav-links a{display:block;padding:11px 14px;border-radius:10px;color:var(--ink);font-size:14px;font-weight:600;transition:background .18s ease,color .18s ease,transform .18s ease;}\n  .nav-links a:hover{background:#EEF3EE;color:var(--blue);transform:translateX(2px);text-decoration:none;}\n  .nav-toggle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:42px;margin-left:12px;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 3px 10px rgba(18,24,26,.06);}\n  .nav-toggle span{width:20px;height:2px;margin:2.5px 0;background:var(--ink);transition:transform .2s ease,opacity .2s ease;}\n  .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);}\n  .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;}\n  .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}\n  html.dark .nav-links{background:rgba(23,28,31,.98);}\n  @media (max-width:700px){.nav-inner{padding:10px 18px;}.nav-links{position:fixed;top:64px;right:14px;left:14px;width:auto;max-height:calc(100vh - 82px);overflow:auto;}}\n'''
              s = s.replace('</style>', css + '</style>', 1)
          js_marker = 'FINAL_NAV_EMAIL_CONTROLLER'
          if js_marker not in s:
              js = '''\n<script>/* FINAL_NAV_EMAIL_CONTROLLER */\n(function(){const t=document.getElementById('navToggle'),l=document.getElementById('navLinks');if(!t||!l)return;t.addEventListener('click',()=>{const o=l.classList.toggle('open');t.setAttribute('aria-expanded',String(o));t.setAttribute('aria-label',o?'Close navigation menu':'Open navigation menu')});l.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{l.classList.remove('open');t.setAttribute('aria-expanded','false');t.setAttribute('aria-label','Open navigation menu')}));document.addEventListener('click',e=>{if(l.classList.contains('open')&&!l.contains(e.target)&&!t.contains(e.target)){l.classList.remove('open');t.setAttribute('aria-expanded','false')}})})();</script>\n'''
              s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply final portfolio navbar and email [portfolio-final-applied]"
          git push
