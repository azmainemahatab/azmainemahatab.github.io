name: Final navbar and email update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[final-navbar-email]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update existing portfolio safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Set the portfolio contact email requested by the owner.
          for old in (
              'rifatmahtab107@gmail.com',
              'seoexpertmahatabazmaine@gmail.com',
          ):
              s = s.replace(old, 'seoexpertrefat@gmail.com')

          # Keep the existing hamburger button and turn it into the primary desktop/mobile navigation.
          css_marker = '/* ---------- FINAL MODERN HAMBURGER NAV ---------- */'
          if css_marker not in s:
              css = r'''

  /* ---------- FINAL MODERN HAMBURGER NAV ---------- */
  nav{
    background:rgba(251,251,249,.88);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .nav-inner{
    max-width:1280px;
    padding:12px 28px;
  }

  .nav-actions{
    margin-left:auto;
    position:relative;
  }

  .nav-links{
    display:none;
    position:absolute;
    top:calc(100% + 12px);
    right:0;
    width:250px;
    padding:8px;
    flex-direction:column;
    align-items:stretch;
    gap:2px;
    background:rgba(255,255,255,.97);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 18px 45px rgba(18,24,26,.16);
    list-style:none;
    z-index:100;
  }

  .nav-links.open{display:flex;}
  .nav-links li + li{margin-left:0;}

  .nav-links a{
    display:block;
    padding:11px 14px;
    border-radius:10px;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    transition:background .18s ease,color .18s ease,transform .18s ease;
  }

  .nav-links a:hover{
    background:#EEF3EE;
    color:var(--blue);
    transform:translateX(2px);
    text-decoration:none;
  }

  .nav-toggle{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    margin-left:12px;
    padding:7px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    box-shadow:0 3px 10px rgba(18,24,26,.06);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }

  .nav-toggle:hover{
    transform:translateY(-1px);
    border-color:rgba(32,78,107,.35);
    box-shadow:0 7px 18px rgba(18,24,26,.10);
  }

  .nav-toggle span{
    width:20px;
    height:2px;
    margin:2.5px 0;
    background:var(--ink);
    transition:transform .2s ease,opacity .2s ease;
  }

  .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;}
  .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  html.dark .nav-links{
    background:rgba(23,28,31,.98);
    box-shadow:0 18px 45px rgba(0,0,0,.38);
  }

  html.dark .nav-links a{color:var(--ink);}
  html.dark .nav-links a:hover{background:#20282C;color:var(--blue);}

  @media (max-width:700px){
    .nav-inner{padding:10px 18px;}
    .nav-links{
      position:fixed;
      top:64px;
      right:14px;
      left:14px;
      width:auto;
      max-height:calc(100vh - 82px);
      overflow:auto;
    }
  }
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          # Add a lightweight fallback controller if the existing script does not already bind the toggle.
          js_marker = '/* FINAL_NAV_FALLBACK_CONTROLLER */'
          if js_marker not in s:
              js = r'''
<script>
/* FINAL_NAV_FALLBACK_CONTROLLER */
(function(){
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  if(!toggle || !links) return;
  if(toggle.dataset.finalController === '1') return;
  toggle.dataset.finalController = '1';

  toggle.addEventListener('click', function(){
    const open = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
  });

  links.querySelectorAll('a').forEach(function(link){
    link.addEventListener('click', function(){
      links.classList.remove('open');
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-label','Open navigation menu');
    });
  });

  document.addEventListener('click', function(event){
    if(!links.classList.contains('open')) return;
    if(!links.contains(event.target) && !toggle.contains(event.target)){
      links.classList.remove('open');
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-label','Open navigation menu');
    }
  });
})();
</script>
'''
              s = s.replace('</body>', js + '\n</body>', 1)

          if s == original:
              raise SystemExit('No changes were necessary.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-navbar-email-update.yml
          git add index.html .github/workflows/final-navbar-email-update.yml
          git commit -m "Final modern hamburger navigation and contact email [final-navbar-email]"
          git push
