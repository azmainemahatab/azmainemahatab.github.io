name: Update footer location

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace footer text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'Academic &amp; Research Portfolio <span aria-hidden="true">·</span> © 2026 Mahatab Azmaine Refat'
          new = 'Dhaka, Bangladesh <span aria-hidden="true">·</span> © 2026 Mahatab Azmaine Refat'
          if old not in text:
              raise SystemExit('Expected footer text was not found; no changes made.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          rm .github/workflows/update-footer-location.yml
          git add .github/workflows/update-footer-location.yml
          git commit -m "Update contact footer location"
          git push
