name: Validate Languages & Proficiency

on:
  push:
    paths:
      - '.github/workflows/apply-languages-proficiency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current certificate set
        run: |
          set -e
          test -f assets/certificates/englishscore.svg
          test -f assets/certificates/chinese-hsk12.svg
          test -f assets/certificates/russian.svg
          test ! -f assets/certificates/british-council.svg
          test ! -f assets/certificates/ef-set.svg
          test ! -f assets/certificates/chinese-hsk2.svg
          grep -q 'certificate-modal' index.html
          grep -q 'data-certificate=' index.html
          ! grep -q 'target="_blank"' index.html
          echo 'Current language certificates and in-page viewer validated.'
