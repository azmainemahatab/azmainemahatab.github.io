name: Apply justified body typography

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive paragraph alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".about-block p{color:var(--ink-soft);font-size:15px;}"
          new = ".about-block p{color:var(--ink-soft);font-size:15px;text-align:justify;}"
          if old not in s:
              raise SystemExit('Expected About paragraph rule not found; no changes made.')
          s = s.replace(old, new, 1)
          marker = "@media (max-width:700px){.about-block{flex-basis:100%;}}"
          mobile = "@media (max-width:700px){.about-block{flex-basis:100%;}.about-block p{text-align:left;}}"
          if marker not in s:
              raise SystemExit('Expected About mobile rule not found; no changes made.')
          s = s.replace(marker, mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          test "$(grep -o 'about-block p{[^}]*text-align:justify' index.html | wc -l)" -eq 1
          test "$(grep -o 'about-block p{text-align:left' index.html | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Improve responsive paragraph alignment'
          git push
