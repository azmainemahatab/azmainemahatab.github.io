name: Apply final navbar update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-final-navbar]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update portfolio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Final contact email.
          for old in ('rifatmahtab107@gmail.com', 'seoexpertmahatabazmaine@gmail.com'):
              s = s.replace(old, 'seoexpertrefat@gmail.com')

          # Ensure navigation elements have stable IDs for the controller.
          s = re.sub(r'class="nav-links"(?![^>]*\bid="navLinks"\b)', 'class="nav-links" id="navLinks"', s, count=1)
          if 'id="navToggle"' not in s:
              s = re.sub(
                  r'<button([^>]*class="nav-toggle"[^>]*)>',
                  lambda m: '<button' + m.group(1) + ' id="navToggle" aria-expanded="false" aria-label="Open navigation menu">',
                  s, count=1
              )

          css_marker = '/* ---------- FINAL MODERN HAMBURGER NAV V2 ---------- */'
          if css_marker not in s:
              css = r'''

  /* ---------- FINAL MODERN HAMBURGER NAV V2 ---------- */
  .nav-inner{max-width:1280px;padding:12px 28px;}
  .nav-actions{margin-left:auto;position:relative;display:flex;align-items:center;}
  .nav-links{display:none;position:absolute;top:calc(100% + 12px);right:0;width:250px;padding:8px;flex-direction:column;align-items:stretch;gap:2px;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(18,24,26,.16);z-index:100;}
  .nav-links.open{display:flex;}
  .nav-links li+li{margin-left:0;}
  .nav-links a{display:block;padding:11px 14px;border-radius:10px;color:var(--ink);font-size:14px;font-weight:600;transition:background .18s ease,color .18s ease,transform .18s ease;}
  .nav-links a:hover{background:#EEF3EE;color:var(--blue);transform:translateX(2px);text-decoration:none;}
  .nav-toggle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:42px;margin-left:12px;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 3px 10px rgba(18,24,26,.06);cursor:pointer;}
  .nav-toggle span{width:20px;height:2px;margin:2.5px 0;background:var(--ink);transition:transform .2s ease,opacity .2s ease;}
  .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;}
  .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  @media(max-width:700px){
    .nav-inner{padding:10px 18px;}
    .nav-links{position:fixed;top:64px;right:14px;left:14px;width:auto;max-height:calc(100vh - 82px);overflow:auto;}
  }
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          js_marker = 'FINAL_NAV_CONTROLLER_V2'
          if js_marker not in s:
              js = r'''
<script>
/* FINAL_NAV_CONTROLLER_V2 */
(function(){
  function initNav(){
    const toggle=document.getElementById('navToggle');
    const links=document.getElementById('navLinks');
    if(!toggle||!links||toggle.dataset.navReady==='1') return;
    toggle.dataset.navReady='1';
    toggle.addEventListener('click',function(){
      const open=links.classList.toggle('open');
      toggle.setAttribute('aria-expanded',String(open));
      toggle.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');
    });
    links.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){
      links.classList.remove('open');
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-label','Open navigation menu');
    });});
    document.addEventListener('click',function(e){
      if(links.classList.contains('open')&&!links.contains(e.target)&&!toggle.contains(e.target)){
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded','false');
      }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initNav); else initNav();
})();
</script>
'''
              s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-final-navbar.yml
          git add index.html .github/workflows/apply-final-navbar.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply final hamburger navigation and email [apply-final-navbar]"
          git push

# Trigger commit to apply the requested final navbar and email changes.
