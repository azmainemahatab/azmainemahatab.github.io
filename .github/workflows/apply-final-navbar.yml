name: Force visible full-name navbar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[full-name-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace visible navbar name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace every known abbreviated navbar branding with the complete name.
          for old in ['M. Azmaine Refat', 'M. Azmaine', 'Mahatab Azmaine', 'Azmaine Refat']:
              s = s.replace(old, 'Mahatab Azmaine Refat')

          # Also replace whatever text is currently inside the first nav-logo element.
          pattern = r'(<(?:a|div|span)[^>]*class=["\'][^"\']*nav-logo[^"\']*["\'][^>]*>).*?(</(?:a|div|span)>)'
          s, n = re.subn(pattern, r'\1Mahatab Azmaine Refat\2', s, count=1, flags=re.S|re.I)

          # Keep the requested email.
          s = s.replace('rifatmahtab107@gmail.com', 'seoexpertrefat@gmail.com')
          s = s.replace('seoexpertmahatabazmaine@gmail.com', 'seoexpertrefat@gmail.com')

          p.write_text(s, encoding='utf-8')
          print('navbar logo replacements:', n)
          PY

      - name: Verify visible name and commit
        shell: bash
        run: |
          grep -q 'class="nav-logo"' index.html
          grep -q 'Mahatab Azmaine Refat' index.html
          grep -q 'seoexpertrefat@gmail.com' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-final-navbar.yml
          git add index.html .github/workflows/apply-final-navbar.yml
          git commit -m "Apply visible full-name navbar [full-name-applied]"
          git push
