name: Finalize Certificate Cards

on:
  push:
    paths:
      - '_certificate_cards_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild certificate cards and viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<!-- LANGUAGES-PROFICIENCY-START -->.*?<!-- LANGUAGES-PROFICIENCY-END -->\s*', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*<style id="languages-proficiency-styles">.*?</style>\s*', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*<!-- CERTIFICATE-VIEWER-START -->.*?<!-- CERTIFICATE-VIEWER-END -->\s*', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*<style id="certificate-viewer-styles">.*?</style>\s*', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*<script id="certificate-viewer-script">.*?</script>\s*', '\n', s, count=1, flags=re.S)

          section = '''
<!-- LANGUAGES-PROFICIENCY-START -->
<section id="languages-proficiency">
  <div class="section-head">
    <div class="section-kicker">LANGUAGES</div>
    <h2>Languages &amp; Proficiency</h2>
    <p class="languages-intro">Language credentials presented with direct certificate evidence and an in-page certificate viewer.</p>
  </div>
  <div class="language-card-list">
    <article class="language-card">
      <div class="language-card-media"><img src="/assets/certificates/englishscore.svg" alt="British Council EnglishScore certificate"></div>
      <div class="language-card-body"><div class="language-main">
        <div class="language-title">English</div><div class="language-issuer">British Council</div>
        <span class="language-level">B2 · Upper-Intermediate</span>
        <div class="language-credential">EnglishScore Certificate</div>
        <div class="language-meta"><span>Issued: 30 Dec 2024</span><span>CEFR: B2</span></div>
        <p>Achieved CEFR B2 in the EnglishScore Core Skills test issued by the British Council.</p>
      </div><button class="language-action" type="button" data-certificate="/assets/certificates/englishscore.svg" data-certificate-title="EnglishScore Certificate — British Council">View Certificate <span aria-hidden="true">↗</span></button></div>
    </article>

    <article class="language-card">
      <div class="language-card-media"><img src="/assets/certificates/chinese-hsk12.svg" alt="Chinese HSK Level 1 and Level 2 certificate"></div>
      <div class="language-card-body"><div class="language-main">
        <div class="language-title">Chinese (Mandarin)</div><div class="language-issuer">Shanghai University of Political Science and Law</div>
        <div class="language-levels"><span class="language-level">HSK Level 1 · A1</span><span class="language-level">HSK Level 2 · A2</span></div>
        <div class="language-credential">HSK Course Completion</div>
        <div class="language-meta"><span>Completed: 30 Dec 2024</span><span>Credential ID: 2024WLZWKT20241000668</span></div>
        <p>Successfully completed the Chinese language HSK course covering HSK Level 1 and HSK Level 2 through Shanghai University of Political Science and Law.</p>
      </div><button class="language-action" type="button" data-certificate="/assets/certificates/chinese-hsk12.svg" data-certificate-title="HSK Course Completion — Chinese (Mandarin)">View Certificate <span aria-hidden="true">↗</span></button></div>
    </article>

    <article class="language-card">
      <div class="language-card-media"><img src="/assets/certificates/russian.svg" alt="Russian language certificate from St. Petersburg University"></div>
      <div class="language-card-body"><div class="language-main">
        <div class="language-title">Russian</div><div class="language-issuer">St. Petersburg University</div>
        <span class="language-level">A1 · Beginner</span>
        <div class="language-credential">Russian Language in the Tourism Context</div>
        <div class="language-meta"><span>Issued: 22 Nov 2024</span><span>Course: 09 Sep 2024 – 22 Nov 2024</span></div>
        <p>Successfully completed the Russian language course in the tourism context through the Centre for Open Education at St. Petersburg University.</p>
      </div><button class="language-action" type="button" data-certificate="/assets/certificates/russian.svg" data-certificate-title="Russian Language in the Tourism Context">View Certificate <span aria-hidden="true">↗</span></button></div>
    </article>
  </div>
</section>
<!-- LANGUAGES-PROFICIENCY-END -->
'''
          anchor = re.search(r'(?=<section[^>]+id=["\']research["\'])', s, re.I)
          if not anchor: raise SystemExit('research section not found')
          s = s[:anchor.start()] + section + '\n' + s[anchor.start():]

          styles = '''
<style id="languages-proficiency-styles">
.languages-intro{color:var(--ink-soft);font-size:14.5px;margin-top:8px;max-width:760px}.language-card-list{display:flex;flex-direction:column;gap:14px}.language-card{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:196px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 24px -22px rgba(18,24,26,.28);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.language-card:hover{transform:translateY(-2px);border-color:rgba(32,78,107,.24);box-shadow:0 12px 28px -20px rgba(18,24,26,.25)}.language-card-media{margin:12px;width:256px;height:170px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f5f7f9;display:flex;align-items:center;justify-content:center}.language-card-media img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}.language-card-body{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:22px;min-width:0}.language-main{min-width:0}.language-title{font-family:'Space Grotesk',sans-serif;font-size:20px;line-height:1.15;font-weight:700}.language-issuer{color:var(--blue);font-size:13px;margin-top:4px;line-height:1.35}.language-levels{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.language-level{display:inline-flex;border:1px solid rgba(32,78,107,.18);background:#F2F6FA;color:var(--blue);border-radius:999px;padding:4px 9px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;white-space:nowrap}.language-credential{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin-top:9px}.language-meta{display:flex;flex-wrap:wrap;gap:5px 14px;color:var(--ink-soft);font-size:11.5px;margin-top:7px}.language-main p{color:var(--ink-soft);font-size:12.5px;line-height:1.45;margin:7px 0 0;max-width:760px}.language-action{appearance:none;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:150px;border:1px solid var(--blue);border-radius:8px;padding:10px 14px;background:transparent;color:var(--blue);font:600 12.5px 'Roboto',sans-serif;white-space:nowrap;cursor:pointer}.language-action:hover{background:var(--blue);color:#fff}.language-action:focus-visible{outline:3px solid rgba(32,78,107,.25);outline-offset:2px}@media(max-width:850px){.language-card{grid-template-columns:210px minmax(0,1fr)}.language-card-media{width:186px;height:145px}.language-card-body{padding:15px;gap:12px}.language-action{min-width:125px}}@media(max-width:650px){.language-card{grid-template-columns:1fr}.language-card-media{width:auto;height:200px;margin:10px}.language-card-body{align-items:flex-start;flex-direction:column;padding:12px 14px 15px}.language-action{width:100%}}
</style>
'''
          s = s.replace('</head>', styles + '</head>', 1)

          viewer = '''
<!-- CERTIFICATE-VIEWER-START -->
<div class="certificate-modal" id="certificate-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="certificate-modal-title">
  <div class="certificate-modal-backdrop" data-certificate-close></div>
  <div class="certificate-modal-panel" role="document">
    <div class="certificate-modal-header"><h3 id="certificate-modal-title">Certificate</h3><button class="certificate-modal-close" type="button" aria-label="Close certificate viewer" data-certificate-close>×</button></div>
    <div class="certificate-modal-content"><img id="certificate-modal-image" src="" alt="Certificate preview"></div>
  </div>
</div>
<!-- CERTIFICATE-VIEWER-END -->
'''
          s = s.replace('</body>', viewer + '\n</body>', 1)
          viewer_styles = '''
<style id="certificate-viewer-styles">
.certificate-modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px}.certificate-modal.open{display:flex}.certificate-modal-backdrop{position:absolute;inset:0;background:rgba(8,14,18,.72);backdrop-filter:blur(3px)}.certificate-modal-panel{position:relative;z-index:1;width:min(1100px,94vw);height:min(900px,92vh);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}.certificate-modal-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}.certificate-modal-header h3{font-size:16px;font-weight:700}.certificate-modal-close{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:8px;font-size:25px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}.certificate-modal-close:hover{border-color:var(--blue);color:var(--blue)}.certificate-modal-content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#f5f7f9;overflow:auto}.certificate-modal-content img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;background:#fff;border:1px solid var(--line)}body.certificate-modal-open{overflow:hidden}@media(max-width:650px){.certificate-modal{padding:10px}.certificate-modal-panel{width:96vw;height:94vh;border-radius:12px}.certificate-modal-content{padding:10px}.certificate-modal-header{padding:10px 12px}}
</style>
'''
          s = s.replace('</head>', viewer_styles + '</head>', 1)
          script = '''
<script id="certificate-viewer-script">
(function(){const modal=document.getElementById('certificate-modal');const image=document.getElementById('certificate-modal-image');const title=document.getElementById('certificate-modal-title');if(!modal||!image||!title)return;const close=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');image.removeAttribute('src');document.body.classList.remove('certificate-modal-open');};document.addEventListener('click',function(e){const button=e.target.closest('[data-certificate]');if(button){image.src=button.dataset.certificate;image.alt=button.dataset.certificateTitle||'Certificate preview';title.textContent=button.dataset.certificateTitle||'Certificate';modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('certificate-modal-open');return;}if(e.target.closest('[data-certificate-close]'))close();});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('open'))close();});})();
</script>
'''
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

          certdir=Path('assets/certificates')
          old_bc=certdir/'british-council.svg'; old_ef=certdir/'ef-set.svg'; old_cn=certdir/'chinese-hsk2.svg'; new_cn=certdir/'chinese-hsk12.svg'
          if old_bc.exists(): old_bc.unlink()
          if old_ef.exists(): old_ef.unlink()
          if old_cn.exists(): new_cn.write_text(old_cn.read_text(encoding='utf-8'),encoding='utf-8'); old_cn.unlink()
          (certdir/'englishscore.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><rect x="24" y="24" width="1152" height="712" rx="18" fill="#fff" stroke="#204E6B" stroke-width="3"/><path d="M820 24h356v712H820c130-92 194-209 194-356S950 116 820 24z" fill="#5B3FA8"/><text x="72" y="110" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#204E6B">BRITISH COUNCIL</text><text x="72" y="210" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#12181A">EnglishScore</text><text x="72" y="270" font-family="Arial,sans-serif" font-size="32" fill="#5B6568">English Certificate</text><text x="72" y="350" font-family="Arial,sans-serif" font-size="26" fill="#5B6568">This is to certify that</text><text x="72" y="408" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#12181A">Mahatab Azmaine Refat</text><text x="72" y="458" font-family="Arial,sans-serif" font-size="25" fill="#5B6568">has achieved CEFR B2 in the EnglishScore Core Skills test</text><text x="72" y="535" font-family="Arial,sans-serif" font-size="25" fill="#5B6568">30 December 2024</text><circle cx="1000" cy="380" r="112" fill="#fff" opacity=".96"/><text x="1000" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#5B3FA8">B2</text><text x="1000" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#204E6B">Upper-Intermediate</text><text x="72" y="650" font-family="Arial,sans-serif" font-size="20" fill="#5B6568">Scott McDonald · Chief Executive, British Council</text></svg>''',encoding='utf-8')
          PY

      - name: Validate certificate set and viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('class="language-card"') == 3
          assert s.count('data-certificate=') == 3
          assert 'target="_blank"' not in s[s.find('<!-- LANGUAGES-PROFICIENCY-START -->'):s.find('<!-- LANGUAGES-PROFICIENCY-END -->')]
          assert 'certificate-modal' in s
          assert 'british-council.svg' not in s and 'ef-set.svg' not in s
          assert Path('assets/certificates/englishscore.svg').exists()
          assert Path('assets/certificates/chinese-hsk12.svg').exists()
          assert Path('assets/certificates/russian.svg').exists()
          assert not Path('assets/certificates/british-council.svg').exists()
          assert not Path('assets/certificates/ef-set.svg').exists()
          assert not Path('assets/certificates/chinese-hsk2.svg').exists()
          print('Current certificate set and in-page viewer validated.')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/certificates .github/workflows/finalize-certificate-cards.yml
          git diff --cached --quiet || git commit -m "Refresh language certificates with in-page viewer"
          git push
