name: Upgrade Hero and Contact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          hero = '''<section id="home" class="hero-section">
            <div class="hero">
              <div class="hero-copy">
                <div class="eyebrow">ACADEMIC &amp; RESEARCH PORTFOLIO</div>
                <h1>Mahatab Azmaine Refat</h1>
                <p class="hero-role">Health Science • Botany • Public Health • Research</p>
                <p class="tagline">Interdisciplinary academic and research portfolio exploring the intersection of human health, plant science, public health, environmental health, and evidence-based practice.</p>
                <div class="hero-cta">
                  <a class="btn btn-primary" href="#projects">Explore My Work</a>
                  <a class="btn btn-ghost" href="#cv">View CV</a>
                </div>
                <div class="hero-focus" aria-label="Academic focus areas">
                  <span>Health Science</span><span>Botany</span><span>Public Health</span><span>Research</span>
                </div>
              </div>
              <div class="hero-visual">
                <div class="hero-photo-frame">
                  <img class="hero-photo" src="assets/profile.jpg" alt="Mahatab Azmaine Refat" loading="eager" fetchpriority="high">
                </div>
                <div class="hero-badge"><strong>Research Focus</strong><span>Health • Environment • Plants</span></div>
              </div>
            </div>
          </section>'''

          contact = '''<section id="contact">
            <div class="section-head">
              <div class="section-kicker">CONTACT</div>
              <h2>Let’s Connect</h2>
            </div>
            <div class="contact-card">
              <div class="contact-copy">
                <h3>Academic, research &amp; professional opportunities</h3>
                <p>Open to academic collaboration, research opportunities, internships, and professional conversations across health science, public health, environmental health, and related fields.</p>
              </div>
              <div class="contact-links">
                <a class="contact-link" href="mailto:seoexpertrefat@gmail.com"><span class="contact-icon" aria-hidden="true">@</span><span><strong>Email</strong><small>seoexpertrefat@gmail.com</small></span></a>
                <a class="contact-link" href="https://www.linkedin.com/in/mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon" aria-hidden="true">in</span><span><strong>LinkedIn</strong><small>linkedin.com/in/mahatabazmaine</small></span></a>
                <a class="contact-link" href="https://youtube.com/@mahatabazmaine" target="_blank" rel="noopener noreferrer"><span class="contact-icon" aria-hidden="true">▶</span><span><strong>YouTube</strong><small>@mahatabazmaine</small></span></a>
              </div>
              <div class="contact-footer">Mahatab Azmaine Refat · Academic &amp; Research Portfolio · Bangladesh</div>
            </div>
          </section>'''

          def replace_section(text, section_id, replacement):
              pattern = rf'<section\s+id=["\']{re.escape(section_id)}["\'][^>]*>.*?</section>'
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.I|re.S)
              if n != 1:
                  raise SystemExit(f'Could not uniquely replace section: {section_id} (matches={n})')
              return out

          s = replace_section(s, 'home', hero)
          s = replace_section(s, 'contact', contact)

          css = '''
          /* ---------- HERO / CONTACT PROFESSIONAL UPGRADE ---------- */
          .hero-section{padding:0;border-bottom:1px solid var(--line);}
          .hero-section .hero{max-width:1000px;margin:0 auto;padding:78px 24px 70px;gap:56px;}
          .hero-copy{flex:1;min-width:0;}
          .hero-role{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;color:var(--blue);margin-top:12px;}
          .hero-focus{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
          .hero-focus span{font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);}
          .hero-visual{width:230px;flex:0 0 230px;display:flex;flex-direction:column;align-items:center;gap:12px;}
          .hero-photo-frame{padding:8px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 18px 40px -20px rgba(18,24,26,.28);}
          .hero-photo-frame .hero-photo{width:198px;height:198px;border-radius:18px;border:0;box-shadow:none;}
          .hero-badge{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center;}
          .hero-badge strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--blue);}
          .hero-badge span{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
          .contact-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:28px;box-shadow:0 18px 40px -28px rgba(18,24,26,.24);}
          .contact-copy{max-width:700px;}
          .contact-copy h3{font-size:21px;margin-bottom:7px;}
          .contact-copy p{font-size:14.5px;color:var(--ink-soft);}
          .contact-links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px;}
          .contact-link{display:flex;align-items:center;gap:11px;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--bg);text-decoration:none;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;}
          .contact-link:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 10px 22px -18px rgba(18,24,26,.3);text-decoration:none;}
          .contact-icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 34px;border-radius:9px;background:var(--blue);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;}
          .contact-link strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:13px;}
          .contact-link small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
          .contact-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--ink-soft);font-size:12px;}
          @media (max-width:700px){
            .hero-section .hero{padding:46px 20px 50px;gap:28px;}
            .hero-visual{order:-1;width:100%;flex-basis:auto;align-items:flex-start;}
            .hero-photo-frame .hero-photo{width:150px;height:150px;}
            .hero-badge{width:auto;min-width:220px;}
            .hero-role{font-size:16px;}
            .hero-focus{margin-top:18px;}
            .contact-card{padding:22px 18px;}
            .contact-links{grid-template-columns:1fr;}
          }
          @media (prefers-reduced-motion:reduce){.contact-link{transition:none}.contact-link:hover{transform:none}}
          '''
          if 'HERO / CONTACT PROFESSIONAL UPGRADE' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ('hero', 'id="home"' in s and 'Mahatab Azmaine Refat' in s and 'Explore My Work' in s),
            ('contact', 'id="contact"' in s and 'Let’s Connect' in s and 'seoexpertrefat@gmail.com' in s),
            ('linkedin', 'linkedin.com/in/mahatabazmaine' in s),
            ('youtube', 'youtube.com/@mahatabazmaine' in s),
            ('github-contact-removed', 'contact-link' in s and 'github.com/azmainemahatab' not in s[s.find('id="contact"'):s.find('id="contact"')+5000]),
            ('favicon-preserved', '/favicon.svg?v=2' in s),
          ]
          failed=[n for n,ok in checks if not ok]
          if failed: raise SystemExit('Verification failed: '+', '.join(failed))
          print('All Hero/Contact verification checks passed.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine hero and contact sections'
          git push
