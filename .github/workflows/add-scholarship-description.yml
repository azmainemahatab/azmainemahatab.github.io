name: Portfolio Content Updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update portfolio certificates
        run: python3 scripts/update_language_certificates.py

      - name: Validate and commit
        run: |
          set -e
          test -f assets/certificates/englishscore.svg
          test -f assets/certificates/chinese-hsk12.svg
          test -f assets/certificates/russian.svg
          test ! -f assets/certificates/british-council.svg
          test ! -f assets/certificates/ef-set.svg
          test ! -f assets/certificates/chinese-hsk2.svg
          grep -q 'certificate-modal' index.html
          grep -q 'data-certificate=' index.html
          test "$(grep -o 'class=\"language-card\"' index.html | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/certificates
          if git diff --cached --quiet; then
            echo 'No portfolio changes needed.'
          else
            git commit -m "Refresh language certificates and viewer"
            git push
          fi
