name: Add UoPeople Scholarship Description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="entry">\n      <div class="entry-top">\n        <div><span class="entry-title">University of the People Institutional Scholarship</span></div>\n      </div>\n    </div>'''
          new = '''<div class="entry">\n      <div class="entry-top">\n        <div><span class="entry-title">University of the People Institutional Scholarship</span></div>\n      </div>\n      <div class="entry-desc">Institutional scholarship providing financial support toward my undergraduate education at the University of the People.</div>\n    </div>'''
          if old not in s:
              raise SystemExit('Target scholarship entry not found; no changes made.')
          if 'Institutional scholarship providing financial support toward my undergraduate education at the University of the People.' in s:
              raise SystemExit('Description already present; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: add UoPeople scholarship description"
          git push