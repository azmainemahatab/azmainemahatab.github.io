name: Apply Freelance Portfolio Architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace existing freelance section without duplication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FREELANCE PORTFOLIO -->'
          start=s.find(marker)
          if start<0: raise SystemExit('Freelance marker not found')
          a=s.find('<section id="freelance">',start)
          b=s.find('</section>',a)
          if a<0 or b<0: raise SystemExit('Freelance section not found')
          b+=len('</section>')
          section='''<!-- FREELANCE PORTFOLIO -->
          <section id="freelance">
            <div class="section-head">
              <div class="section-kicker">Freelance Portfolio</div>
              <h2>Projects &amp; Case Studies</h2>
            </div>
            <p class="freelance-intro">A selection of freelance projects, self-directed work, and case studies across SEO, WordPress, digital marketing, and online growth.</p>
            <div class="freelance-services" aria-label="Freelance services">
              <span>SEO &amp; Search Optimization</span><span>WordPress</span><span>Digital Marketing</span><span>Website Optimization</span><span>Content Strategy</span>
            </div>
            <div class="soon-card" id="freelance-public-state">
              <div class="soon-icon" aria-hidden="true">🚧</div>
              <div class="freelance-status">WORK IN PROGRESS</div>
              <h3>Selected Projects Coming Soon</h3>
              <p>I’m currently documenting selected freelance projects, practical work, and case studies. Public case studies will be added here as projects are completed and ready to share.</p>
              <div class="soon-dots" aria-hidden="true"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span></span><span></span></div>
              <a href="#contact" class="btn btn-primary">Want to Work Together? Get in Touch</a>
            </div>
            <div class="freelance-private-preview" id="freelance-private-preview" hidden>
              <div class="private-preview-head"><div><div class="section-kicker">Private Draft Workspace</div><h3>Freelance Portfolio Drafts</h3><p>Draft cards are stored only in this browser and are not published to the website.</p></div><button type="button" class="btn btn-ghost" id="freelance-preview-close">Close Preview</button></div>
              <div id="freelance-draft-grid" class="freelance-project-grid"></div>
              <p class="private-preview-note">Public visitors see only the Coming Soon state. Draft project data stays in this browser's local storage.</p>
            </div>
          </section>'''
          s=s[:a]+section+s[b:]
          css='''
          /* Freelance portfolio additions */
          .freelance-intro{color:var(--ink-soft);font-size:15px;max-width:760px;margin:-10px 0 20px}.freelance-services{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}.freelance-services span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--ink-soft)}.freelance-status{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--lime);margin-bottom:8px;font-weight:600}.freelance-private-preview{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.private-preview-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.private-preview-head h3{font-size:22px;margin-bottom:5px}.private-preview-head p,.private-preview-note{color:var(--ink-soft);font-size:13.5px}.freelance-project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.freelance-project-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.freelance-project-card .project-type{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase;margin-bottom:8px}.freelance-project-card h4{font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:8px}.freelance-project-card p{color:var(--ink-soft);font-size:13.5px;margin-bottom:12px}.project-meta{display:flex;flex-wrap:wrap;gap:6px}.project-meta span{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--ink-soft)}.private-preview-note{margin-top:18px}@media(max-width:700px){.freelance-project-grid{grid-template-columns:1fr}.private-preview-head{flex-direction:column}}
          '''
          if '/* Freelance portfolio additions */' not in s: s=s.replace('</style>',css+'\n</style>',1)
          js='''
          // Private freelance drafts: browser-local only; never published in HTML.
          (function(){const key='refat_freelance_drafts_v1',preview=document.getElementById('freelance-private-preview'),pub=document.getElementById('freelance-public-state'),grid=document.getElementById('freelance-draft-grid'),close=document.getElementById('freelance-preview-close');if(!preview||!grid)return;const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}grid.innerHTML=a.length?a.map(x=>`<article class="freelance-project-card"><div class="project-type">${esc(x.type||'PROJECT')}</div><h4>${esc(x.title||'Untitled Project')}</h4><p>${esc(x.description||'')}</p><div class="project-meta">${(x.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></article>`).join(''):'<p class="private-preview-note">No private drafts are stored in this browser yet.</p>'}function open(){preview.hidden=false;pub.hidden=true;render();preview.scrollIntoView({behavior:'smooth',block:'start'})}close?.addEventListener('click',()=>{preview.hidden=true;pub.hidden=false});if(location.hash==='#freelance-private')open()})();
          '''
          if '// Private freelance drafts: browser-local only' not in s: s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="freelance"')==1
          assert s.count('<!-- FREELANCE PORTFOLIO -->')==1
          assert s.count('Projects &amp; Case Studies')==1
          assert 'Selected Projects Coming Soon' in s
          assert 'refat_freelance_drafts_v1' in s
          print('PASS: freelance section is unique and validated')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/apply-freelance-final.yml
          git rm -f .github/workflows/update-freelance-portfolio.yml || true
          git commit -m "Build freelance portfolio section"
          git push